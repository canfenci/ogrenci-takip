<html lang="tr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#007BFF">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* Aynı stiller (değişmedi) */
        body:not(.dark) { background-color: #F8F9FA !important; color: #111111 !important; }
        body:not(.dark) .bg-white, body:not(.dark) .bg-gray-50 { background-color: #FFFFFF !important; color: #111111 !important; }

        body:not(.dark) button.bg-gray-200 { background-color: #E5E7EB !important; color: #111111 !important; }
        body:not(.dark) .stat-badge { background-color: #E9ECEF !important; color: #111111 !important; }
        body:not(.dark) #batchModal .sticky-footer { background-color: #F3F4F6 !important; color: #111111 !important; }
        body:not(.dark) .motivation-card { background-color: #FEF3C7 !important; color: #78350F !important; border-color: #FDE68A !important; }
        body:not(.dark) .weak-card { background-color: #FEE2E2 !important; border-color: #FECACA !important; }
        body:not(.dark) .weak-card h4, body:not(.dark) .weak-card p { color: #7F1D1D !important; }
        body:not(.dark) .strong-card { background-color: #D1FAE5 !important; border-color: #A7F3D0 !important; }

        body:not(.dark) .btn-batch:hover { background-color: #0D5C54 !important; }
        /* Başlık */
        .logo-canfenci { font-weight: 800; display: inline-block; }
        .logo-canfenci .can-part { color: #002D54; }
        .logo-canfenci .fenci-part { color: #D4AF37; }
        body.dark .logo-canfenci .can-part { color: #E2E8F0; }
        body.dark .logo-canfenci .fenci-part { color: #FACC15; }
        .logo-deneme { color: #111111; font-weight: 600; display: inline-block; }
        body.dark .logo-deneme { color: #FFFFFF; }
        
        .student-form-input, .modal-input, select.modal-input {
            background-color: #FFFFFF !important;
            border: 1px solid #D1D5DB !important;
            padding: 0.5rem !important;
            border-radius: 0.5rem !important;
            width: 100% !important;
            color: #111111 !important;
            pointer-events: auto !important;
        }
        body.dark .student-form-input, body.dark .modal-input, body.dark select.modal-input {
            background-color: #374151 !important;
            border-color: #4B5563 !important;
            color: #F8F9FA !important;
        }
        body.dark { background-color: #121212 !important; color: #F8F9FA !important; }
        body.dark .bg-white, body.dark .bg-gray-50 { background-color: #1E1E1E !important; color: #F8F9FA !important; }
        body.dark .text-gray-800 { color: #E0E0E0 !important; }
        .btn-sort-active { background-color: #007BFF !important; color: white !important; }
        .btn-sort-inactive { background-color: #E9ECEF !important; color: #212529 !important; border: 1px solid #CED4DA !important; }
        .stat-badge { padding: 0.25rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; }
        body.dark .btn-sort-inactive { background-color: #2C2C2C !important; color: #F8F9FA !important; }
        body.dark .motivation-card { background-color: #78350F !important; color: #FEF3C7 !important; }
        body.dark .weak-card { background-color: #7F1D1D !important; border-color: #991B1B !important; }
        body.dark .weak-card h4, body.dark .weak-card p { color: #FEE2E2 !important; }
        body.dark .strong-card { background-color: #064E3B !important; border-color: #047857 !important; }
        body.dark .strong-card h4, body.dark .strong-card p { color: #D1FAE5 !important; }
        .soru-satiri {
            background-color: #F9FAFB;
            padding: 0.5rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
        }
        body.dark .soru-satiri {
            background-color: #1E293B;
        }
        /* soru düzenleme stilleri */
        .question-edit-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            border-bottom: 1px solid #e5e7eb;
        }
        body.dark .question-edit-row {
            border-color: #4b5563;

</head>
<body class="bg-gray-100 font-sans antialiased">
    <div id="app-root" class="max-w-5xl mx-auto px-4 py-6 md:py-8">
        <div id="syncStatus" class="fixed bottom-4 right-4 z-50 bg-gray-800 text-white px-3 py-1 rounded-full text-xs shadow-lg hidden"></div>
        <div id="dynamic-content"></div>
    </div>

    <script>
        // ==================== 29 KONU ====================
        const KONU_LISTESI = [
            "Mevsimlerin oluşumu", "İklim ve Hava Hareketleri", "DNA ve Genetik Kod", "Kalıtım",
            "Mutasyon ve Modifikasyon", "Adaptasyon", "Biyoteknoloji", "Katı basıncı", "Sıvı Basıncı",
            "Gaz Basıncı", "Periyodik Cetvel", "Fiziksel ve Kimyasal Değişimler", "Kimyasal Tepkimeler",
            "Asitler ve Bazlar", "Özısı", "Maddenin Hal Değişimi", "Kimya Endüstrisi", "Kaldıraçlar",
            "Makaralar", "Eğik Düzlem ve Çıkrık", "Dişli Çark, Kasnak ve Bileşik Makine", "Besin Zinciri",
            "Fotosentez", "Solunum", "Madde Döngüleri ve Çevre Sorunları", "Sürdürülebilir Kalkınma",
            "Elektrik Yükleri ve Elektriklenme", "Elektrik Yüklü Cisimler ve Elektroskop",
            "Elektrik Enerjisinin Dönüşümü ve Güç Santralleri"
        ];

        let currentStudentId = null, chartInstance = null, currentSortOrder = "default";
        let darkMode = localStorage.getItem('darkMode') === 'true';
        const STORAGE_KEY = "lgs_veri_v6"; // versiyon yükseltildi

        function calculateNet(dogru, yanlis) { let net = dogru - (yanlis/3); return net>0 ? parseFloat(net.toFixed(2)) : 0; }
        function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
        function showSyncStatus(msg, isError) { const el = document.getElementById('syncStatus'); if(el){ el.textContent = msg; el.classList.remove('hidden','bg-gray-800','bg-red-600'); el.classList.add(isError?'bg-red-600':'bg-gray-800'); setTimeout(()=>el.classList.add('hidden'),3000); } }

        function loadStudentsData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if(stored) { return JSON.parse(stored); }
            } catch(e) {}
            return [{ id:"s1", adSoyad:"Zeynep Demir", okul:"Mehmetçik Ortaokulu", hedefLise:"İstanbul Lisesi", hedefNet:"18.5", denemeler:[] }];
        }
        function saveStudentsData(students) { localStorage.setItem(STORAGE_KEY, JSON.stringify(students)); showSyncStatus("✅ Kaydedildi", false); }

        function getOrtalamaNet(ogrenci) { 
            const d = ogrenci.denemeler || []; 
            if(!d.length) return 0; 
            const toplam = d.reduce((s,e)=>s + (e.toplamNet || 0), 0); 
            return parseFloat((toplam/d.length).toFixed(2)); 
        }
        function getKonuBazliBasarilar(ogrenci) {
            // Bu fonksiyon artık soru bazlı veriden konu bazlı istatistik çıkaracak
            const stats={}; KONU_LISTESI.forEach(k=>stats[k]={dogru:0,toplamSoru:0});
            if(!ogrenci.denemeler) return stats;
            for(let den of ogrenci.denemeler) {
                if(den.soruBazliListe) { // yeni format
                    for(let soru of den.soruBazliListe) {
                        if(soru.konuAdi && stats[soru.konuAdi]) {
                            stats[soru.konuAdi].toplamSoru += 1;
                            if(soru.dogruMu === true) stats[soru.konuAdi].dogru += 1;
                            else if(soru.dogruMu === false) { /* yanlış, doğru ekleme */ }
                            // boş sayılmaz çünkü her soru ya doğru ya yanlış
                        }
                    }
                } else if(den.konular) { // eski format uyumluluk
                    for(let k of den.konular) if(stats[k.konuAdi]) {
                        stats[k.konuAdi].toplamSoru += k.toplamSoru;
                        stats[k.konuAdi].dogru += k.dogru;
                    }
                }
            }
            const basari={}; for(let k of KONU_LISTESI) basari[k]=stats[k].toplamSoru ? (stats[k].dogru/stats[k].toplamSoru)*100 : null;
            return basari;
        }
        function getTYMMFeedback(y) { if(y===null) return {etiket:"Veri Yok"}; if(y<50) return {etiket:"Destekleme Gerekli"}; if(y<=80) return {etiket:"Geliştirilebilir"}; return {etiket:"Zenginleştirme"}; }
        function getBestWorstTopics(b) { 
            const entries = Object.entries(b).filter(([_,v])=>v!==null); 
            if(!entries.length) return {zayif:[], guclu:[]}; 
            const sorted = [...entries].sort((a,b)=>a[1]-b[1]); 
            return {zayif: sorted.slice(0,3).map(([k,v])=>({konu:k, yuzde:v.toFixed(1)})), guclu: sorted.slice(-3).reverse().map(([k,v])=>({konu:k, yuzde:v.toFixed(1)}))}; 
        }
        function getMotivationMessage(s) { 
            const d=s.denemeler||[]; 
            if(!d.length) return "📝 İlk denemeyi ekleyin"; 
            const sonNet = d[d.length-1].toplamNet; 
            const hedef = parseFloat(s.hedefNet); 
            if(isNaN(hedef)) return "🎯 Hedef net belirtilmemiş"; 
            const fark = hedef - sonNet; 
            if(fark<=0) return "🎉 Hedefine ulaştın!"; 
            if(fark<=2) return `🚀 Hedefine ${fark.toFixed(1)} net kaldı`; 
            if(fark<=5) return `💪 ${fark.toFixed(1)} net kaldı`; 
            return `📈 Hedefine ${fark.toFixed(1)} net var.`; 
        }

        // Yedekleme (aynı)
        function exportBackup() { const data=loadStudentsData(); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})); a.download="lgs_manuel_yedek.json"; a.click(); }
        function showImportModal() { 
            const modal=document.createElement('div'); modal.className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"; 
            modal.innerHTML=`<div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-md shadow-xl"><h2 class="text-xl font-bold">📂 Manuel Geri Yükle</h2><input type="file" id="restoreFile" accept=".json" class="w-full border p-2 rounded my-2"><button onclick="importBackup()" class="bg-blue-600 text-white w-full py-2 rounded">Yükle</button><button onclick="this.closest('.fixed').remove()" class="mt-2 w-full border rounded py-2">İptal</button></div>`; 
            document.body.appendChild(modal); 
        }
        function importBackup() { 
            const file=document.getElementById('restoreFile').files[0]; 
            if(!file) return; 
            const reader=new FileReader(); 
            reader.onload=e=>{ 
                try{ 
                    const data=JSON.parse(e.target.result); 
                    if(Array.isArray(data)){ 
                        saveStudentsData(data); 
                        alert("Veriler yüklendi!"); 
                        document.querySelector('.fixed')?.remove(); 
                        renderHomeScreen(); 
                    } 
                } catch(err){ alert("Geçersiz dosya"); } 
            }; 
            reader.readAsText(file); 
        }

        // ========== TOPLU DENEME ATAMA (Soru Bazlı, her soru bir konu) ==========
        let soruKonuListesi = [];
        function showBatchExamModal() { 
            soruKonuListesi = [];
            renderBatchExamForm(); 
        }
        function renderBatchExamForm() {
            let totalSoru = soruKonuListesi.length;
            let soruSelectorsHtml = '';
            for(let i=0; i<soruKonuListesi.length; i++) {
                const item = soruKonuListesi[i];
                soruSelectorsHtml += `
                    <div class="flex items-center gap-2 mb-2 soru-satiri">
                        <span class="w-10 text-sm font-medium text-gray-700 dark:text-gray-300">${i+1}. Soru</span>
                        <select class="w-full border rounded p-2 modal-input soruKonuSelect" data-index="${i}">
                            <option value="">-- Kazanım Seç --</option>
                            ${KONU_LISTESI.map(k => `<option value="${k}" ${item.konuAdi === k ? 'selected' : ''}>${k}</option>`).join('')}
                        </select>
                    </div>
                `;
            }
            const students = loadStudentsData();
            const studentCheckboxes = students.map(s => `<label class="flex items-center gap-2 p-1"><input type="checkbox" value="${s.id}" class="studentCheck"> ${escapeHtml(s.adSoyad)} (${escapeHtml(s.okul)})</label>`).join('');
            const modalHtml = `
                <div id="batchModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 overflow-auto p-4">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-5 shadow-xl" onclick="event.stopPropagation()">
                        <div class="flex justify-between items-center mb-3"><h2 class="text-xl font-bold">📋 Toplu Deneme Ata (Soru Bazlı)</h2><button onclick="closeBatchModal()" class="text-gray-500"><i class="fas fa-times text-xl"></i></button></div>
                        <div class="mb-3"><label class="font-medium">Deneme Adı</label><input id="batchExamName" class="w-full border rounded p-2 modal-input" placeholder="Örn: Mart Denemesi"></div>
                        <div class="mb-3"><label class="font-medium">Toplam Soru Sayısı</label><input type="number" id="totalQuestionCount" min="0" value="${totalSoru}" class="w-full border rounded p-2 modal-input"></div>
                        <div id="soruKonuContainer" class="max-h-80 overflow-auto border p-2 rounded mb-3 bg-gray-50 dark:bg-gray-900">${soruSelectorsHtml}</div>
                        <button id="generateSoruSelectors" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-1 rounded text-sm mb-3">Soru Sayısına Göre Listeyi Yenile</button>
                        <div class="mt-3"><label class="font-bold">👥 Öğrencileri Seç:</label><div class="grid grid-cols-2 gap-1 max-h-40 overflow-auto border p-2 rounded bg-gray-50 dark:bg-gray-900">${studentCheckboxes}</div></div>
                        <button id="saveBatchExamBtn" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl font-medium transition">📌 Seçilen Öğrencilere Ata</button>
                    </div>
                </div>
            `;
            const existing = document.getElementById('batchModal'); if(existing) existing.remove();
            const modalDiv = document.createElement('div'); modalDiv.id = 'batchModal'; modalDiv.innerHTML = modalHtml; document.body.appendChild(modalDiv);
            
            const totalInput = document.getElementById('totalQuestionCount');
            const container = document.getElementById('soruKonuContainer');
            const generateBtn = document.getElementById('generateSoruSelectors');
            
            function rebuildSelectors(count) {
                const newList = [];
                for(let i=0; i<count; i++) {
                    const existingItem = soruKonuListesi[i];
                    newList.push({ soruNo: i, konuAdi: existingItem ? existingItem.konuAdi : '' });
                }
                soruKonuListesi = newList;
                let html = '';
                for(let i=0; i<soruKonuListesi.length; i++) {
                    const item = soruKonuListesi[i];
                    html += `
                        <div class="flex items-center gap-2 mb-2 soru-satiri">
                            <span class="w-10 text-sm font-medium text-gray-700 dark:text-gray-300">${i+1}. Soru</span>
                            <select class="w-full border rounded p-2 modal-input soruKonuSelect" data-index="${i}">
                                <option value="">-- Kazanım Seç --</option>
                                ${KONU_LISTESI.map(k => `<option value="${k}" ${item.konuAdi === k ? 'selected' : ''}>${k}</option>`).join('')}
                            </select>
                        </div>
                    `;
                }
                container.innerHTML = html;
                attachSelectEvents();
            }
            
            function attachSelectEvents() {
                document.querySelectorAll('.soruKonuSelect').forEach(sel => {
                    sel.addEventListener('change', (e) => {
                        const idx = parseInt(sel.getAttribute('data-index'));
                        if(!isNaN(idx) && soruKonuListesi[idx]) {
                            soruKonuListesi[idx].konuAdi = sel.value;
                        }
                    });
                });
            }
            
            generateBtn.addEventListener('click', () => {
                let newCount = parseInt(totalInput.value) || 0;
                if(newCount < 0) newCount = 0;
                rebuildSelectors(newCount);
            });
            
            if(totalSoru > 0) rebuildSelectors(totalSoru);
            else rebuildSelectors(0);
            
            document.getElementById('saveBatchExamBtn').addEventListener('click', () => saveBatchExam());
        }
        function closeBatchModal() { document.getElementById('batchModal')?.remove(); }
        function saveBatchExam() {
            const examName = document.getElementById('batchExamName')?.value.trim();
            if(!examName){ alert("Deneme adı girin"); return; }
            const selectedStudents = Array.from(document.querySelectorAll('.studentCheck:checked')).map(cb=>cb.value);
            if(selectedStudents.length===0){ alert("En az bir öğrenci seçin"); return; }
            
            // Soru bazlı liste oluştur
            const soruBazliListe = [];
            for(let i=0; i<soruKonuListesi.length; i++) {
                const item = soruKonuListesi[i];
                if(item.konuAdi) {
                    soruBazliListe.push({
                        soruNo: i+1,
                        konuAdi: item.konuAdi,
                        dogruMu: null  // başlangıçta kararsız, sonradan düzenleme ekranında işaretlenecek
                    });
                }
            }
            if(soruBazliListe.length === 0) { alert("Hiç soru tanımlanmamış!"); return; }
            
            // Konu bazlı istatistikler için (eski uyumluluk) ayrıca konular dizisi oluştur
            const konuSayac = {};
            KONU_LISTESI.forEach(k=>konuSayac[k]=0);
            for(let s of soruBazliListe) konuSayac[s.konuAdi]++;
            const konular = KONU_LISTESI.map(k => ({
                konuAdi: k,
                toplamSoru: konuSayac[k],
                dogru: 0,
                yanlis: 0
            }));
            let toplamSoru = soruBazliListe.length;
            
            const newExam = {
                id: "ex_"+Date.now(),
                denemeAdi: examName,
                tarih: new Date().toISOString().slice(0,10),
                soruBazliListe: soruBazliListe,   // yeni alan
                konular: konular,                   // eski uyumluluk için
                toplamDogru: 0,
                toplamYanlis: 0,
                toplamBos: 0,
                toplamNet: 0,
                toplamSoru: toplamSoru
            };
            const students = loadStudentsData();
            for(let sid of selectedStudents){
                const idx = students.findIndex(s=>s.id===sid);
                if(idx !== -1){
                    if(!students[idx].denemeler) students[idx].denemeler = [];
                    students[idx].denemeler.push(JSON.parse(JSON.stringify(newExam)));
                }
            }
            saveStudentsData(students);
            alert(`${selectedStudents.length} öğrenciye deneme eklendi. (Her soru için doğru/yanlış girişi yapın)`);
            closeBatchModal();
            renderHomeScreen();
        }

        // ========== DENEME DÜZENLEME (Soru Bazlı, Doğru/Yanlış Seçimi) ==========
        function editExam(studentId, examId) {
            const students = loadStudentsData();
            const student = students.find(s => s.id === studentId);
            if(!student) return;
            const exam = student.denemeler.find(e => e.id === examId);
            if(!exam) return;
            // Soru bazlı liste var mı kontrol et
            let soruList = exam.soruBazliListe;
            if(!soruList || soruList.length === 0) {
                // Eski format dönüşümü: konular dizisinden soru bazlı liste üret
                soruList = [];
                for(let k of exam.konular) {
                    if(k.toplamSoru > 0) {
                        for(let i=0; i<k.toplamSoru; i++) {
                            soruList.push({
                                soruNo: soruList.length+1,
                                konuAdi: k.konuAdi,
                                dogruMu: null
                            });
                        }
                    }
                }
                if(soruList.length === 0) { alert("Bu denemede soru yok!"); return; }
                exam.soruBazliListe = soruList;
                // güncelle
                const sIdx = students.findIndex(s=>s.id===studentId);
                if(sIdx!==-1){
                    const eIdx = students[sIdx].denemeler.findIndex(e=>e.id===examId);
                    if(eIdx!==-1) students[sIdx].denemeler[eIdx].soruBazliListe = soruList;
                    saveStudentsData(students);
                }
            }
            
            // Toplam doğru/yanlış hesapla
            let toplamDogru = 0, toplamYanlis = 0;
            for(let s of soruList) {
                if(s.dogruMu === true) toplamDogru++;
                else if(s.dogruMu === false) toplamYanlis++;
            }
            const toplamBos = soruList.length - toplamDogru - toplamYanlis;
            const net = calculateNet(toplamDogru, toplamYanlis);
            
            let soruRows = '';
            for(let i=0; i<soruList.length; i++) {
                const s = soruList[i];
                const dogruChecked = s.dogruMu === true ? 'checked' : '';
                const yanlisChecked = s.dogruMu === false ? 'checked' : '';
                soruRows += `
                    <div class="question-edit-row flex flex-wrap items-center gap-2 p-2 border-b">
                        <span class="w-12 font-medium">${i+1}.</span>
                        <span class="flex-1 text-sm">${s.konuAdi}</span>
                        <label class="flex items-center gap-1 ml-2"><input type="radio" name="q_${i}" value="dogru" ${dogruChecked} class="question-radio" data-index="${i}" data-value="dogru"> Doğru</label>
                        <label class="flex items-center gap-1"><input type="radio" name="q_${i}" value="yanlis" ${yanlisChecked} class="question-radio" data-index="${i}" data-value="yanlis"> Yanlış</label>
                        <label class="flex items-center gap-1"><input type="radio" name="q_${i}" value="bos" ${(!dogruChecked && !yanlisChecked) ? 'checked' : ''} class="question-radio" data-index="${i}" data-value="bos"> Boş</label>
                    </div>
                `;
            }
            const html = `
                <div><button onclick="renderStudentPanel('${studentId}')" class="text-blue-600 mb-2 inline-block">← Geri</button>
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-5">
                    <h2 class="text-xl font-bold mb-3">Deneme Düzenle: ${escapeHtml(exam.denemeAdi)}</h2>
                    <input id="editExamName" class="w-full border rounded p-2 mb-3 modal-input" placeholder="Deneme Adı" value="${escapeHtml(exam.denemeAdi)}">

            // Event listener'lar: radio değiştiğinde footer'ı güncelle
            const radios = document.querySelectorAll('.question-radio');
            const updateFooterFromRadios = () => {
                let dogru=0, yanlis=0, bos=0;
                for(let i=0; i<soruList.length; i++) {
                    const selected = document.querySelector(`input[name="q_${i}"]:checked`);
                    if(selected) {
                        if(selected.value === 'dogru') { dogru++; soruList[i].dogruMu = true; }
                        else if(selected.value === 'yanlis') { yanlis++; soruList[i].dogruMu = false; }
                        else { bos++; soruList[i].dogruMu = null; }
                    } else {
                        bos++;
                        soruList[i].dogruMu = null;
                    }
                }
                const net = calculateNet(dogru, yanlis);
                const footer = document.querySelector('.sticky-footer');
                if(footer) footer.innerHTML = `<span>📊 Toplam: ${soruList.length} soru | D:${dogru} Y:${yanlis} B:${bos}</span><span class="text-blue-600">Net: ${net.toFixed(2)}</span>`;
            };
            radios.forEach(radio => radio.addEventListener('change', updateFooterFromRadios));
            window._soruList = soruList;
        }
        
        function saveExamEdit(studentId, examId) {
            const examName = document.getElementById('editExamName')?.value.trim();
            if(!examName) { alert("Deneme adı girin"); return; }
            const soruList = window._soruList;
            if(!soruList || soruList.length === 0) { alert("Soru listesi boş"); return; }
            let dogru=0, yanlis=0;
            for(let s of soruList) {
                if(s.dogruMu === true) dogru++;
                else if(s.dogruMu === false) yanlis++;
            }
            const bos = soruList.length - dogru - yanlis;
            const net = calculateNet(dogru, yanlis);
            // Konu bazlı istatistikleri güncelle (eski uyumluluk için)
            const konuSayac = {};
            KONU_LISTESI.forEach(k=>konuSayac[k]={toplamSoru:0, dogru:0});
            for(let s of soruList) {
                if(s.konuAdi && konuSayac[s.konuAdi]) {
                    konuSayac[s.konuAdi].toplamSoru++;
                    if(s.dogruMu === true) konuSayac[s.konuAdi].dogru++;
                }
            }
            const konular = KONU_LISTESI.map(k => ({
                konuAdi: k,
                toplamSoru: konuSayac[k].toplamSoru,
                dogru: konuSayac[k].dogru,
                yanlis: konuSayac[k].toplamSoru - konuSayac[k].dogru
            }));
            
            const newExam = {
                id: examId,
                denemeAdi: examName,
                tarih: new Date().toISOString().slice(0,10),
                soruBazliListe: soruList,
                konular: konular,
                toplamDogru: dogru,
                toplamYanlis: yanlis,
                toplamBos: bos,
                toplamNet: net,
                toplamSoru: soruList.length
            };
            const students = loadStudentsData();
            const sIdx = students.findIndex(s => s.id === studentId);
            if(sIdx !== -1) {
                const eIdx = students[sIdx].denemeler.findIndex(e => e.id === examId);
                if(eIdx !== -1) students[sIdx].denemeler[eIdx] = newExam;
                saveStudentsData(students);
            }
            renderStudentPanel(studentId);
        }
        
        function deleteExam(studentId, examId) { 
            if(confirm("Denemeyi sil?")) {

                const sIdx = students.findIndex(s => s.id === studentId);

                    students[sIdx].denemeler = students[sIdx].denemeler.filter(e => e.id !== examId);

        function copyExamToOthers(studentId, examId) {
            const students = loadStudentsData(); const owner = students.find(s => s.id === studentId); if(!owner) return; const exam = owner.denemeler.find(e => e.id === examId); if(!exam) return;
            const others = students.filter(s => s.id !== studentId); if(others.length===0){ alert("Diğer öğrenci yok"); return; }

        function executeCopyExam(source, examId){
            const students = loadStudentsData(); const owner = students.find(s => s.id === source); if(!owner) return; const exam = owner.denemeler.find(e => e.id === examId); if(!exam) return;
            const targets = Array.from(document.querySelectorAll('.copyTarget:checked')).map(cb=>cb.value);
            if(targets.length===0){ alert("Seçim yapmadınız"); return; }
            const copy = JSON.parse(JSON.stringify(exam));
            copy.id = "ex_"+Date.now();
            copy.tarih = new Date().toISOString().slice(0,10);
            for(let tid of targets){
                const idx = students.findIndex(s=>s.id===tid);
                if(idx !== -1){
                    if(!students[idx].denemeler) students[idx].denemeler = [];
                    students[idx].denemeler.push(JSON.parse(JSON.stringify(copy)));
                }
            }
            saveStudentsData(students);
            alert(`${targets.length} öğrenciye kopyalandı.`);
            document.querySelector('.fixed')?.remove();
            renderHomeScreen();
        }

            }).join('');
            const formHtml = `<div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-5 mt-6"><h3 class="font-bold text-lg mb-3"><i class="fas fa-user-plus text-blue-600"></i> Yeni Öğrenci</h3><div class="grid md:grid-cols-2 gap-3"><input type="text" id="newName" placeholder="Ad Soyad" class="student-form-input" onclick="event.stopPropagation()"><input type="text" id="newSchool" placeholder="Okul" class="student-form-input" onclick="event.stopPropagation()"><input type="text" id="newTargetSchool" placeholder="Hedef Lise" class="student-form-input" onclick="event.stopPropagation()"><input type="text" id="newTargetNet" placeholder="Hedef Net" class="student-form-input" onclick="event.stopPropagation()"></div><button onclick="addStudent()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white w-full py-2 rounded-xl font-semibold transition">Kaydet</button></div>`;
            document.getElementById("dynamic-content").innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-extrabold flex items-center gap-2">
                        <img src="logo.svg" alt="Canfenci Logo" class="w-10 h-10 inline-block">
                        <span class="logo-canfenci"><span class="can-part">Can</span><span class="fenci-part">fenci</span></span>
                        <span class="logo-deneme">Deneme Analizi</span>
                    </h1>
                    <span class="bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded-full text-xs">Soru Bazlı Toplu Deneme</span>
                </div>
                ${topHtml}${sortHtml}<div class="grid md:grid-cols-2 gap-5">${studentsHtml}</div>${formHtml}`;
        }
        function getSortedStudents(students, order) { 
            if(order === 'default') return [...students]; 
            const withAvg = students.map(s => ({ ...s, ortalamaNet: getOrtalamaNet(s) })); 
            if(order === 'net-desc') return withAvg.sort((a,b) => b.ortalamaNet - a.ortalamaNet); 
            if(order === 'net-asc') return withAvg.sort((a,b) => a.ortalamaNet - b.ortalamaNet); 
            return students; 
        }
        function setSortOrder(order){ currentSortOrder = order; renderHomeScreen(); }
        function toggleTheme(){ darkMode = !darkMode; localStorage.setItem('darkMode', darkMode); applyTheme(); renderHomeScreen(); }
        function applyTheme(){ if(darkMode) document.body.classList.add('dark'); else document.body.classList.remove('dark'); }
        function addStudent() { 
            const n = document.getElementById('newName')?.value.trim(); 
            const sc = document.getElementById('newSchool')?.value.trim(); 
            const tl = document.getElementById('newTargetSchool')?.value.trim(); 
            const tn = document.getElementById('newTargetNet')?.value.trim(); 
            if(!n || !sc || !tl || !tn){ alert("Tüm alanları doldurun"); return; } 
            const students = loadStudentsData(); 
            students.push({ id:"std"+Date.now(), adSoyad:n, okul:sc, hedefLise:tl, hedefNet:tn, denemeler:[] }); 
            saveStudentsData(students); 
            renderHomeScreen(); 
        }
        function deleteStudent(id) { if(confirm("Öğrenciyi sil?")){ let students = loadStudentsData().filter(s => s.id !== id); saveStudentsData(students); if(currentStudentId === id) renderHomeScreen(); else renderHomeScreen(); } }
        function editStudent(id) { 
            const s = loadStudentsData().find(s => s.id === id); 
            if(!s) return; 
            const modal = document.createElement('div'); modal.className = "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"; 
            modal.innerHTML = `<div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-md"><h2 class="text-xl font-bold">✏️ Düzenle</h2><input id="editName" class="w-full border p-2 rounded mb-2 student-form-input" value="${escapeHtml(s.adSoyad)}"><input id="editSchool" class="w-full border p-2 rounded mb-2 student-form-input" value="${escapeHtml(s.okul)}"><input id="editTargetSchool" class="w-full border p-2 rounded mb-2 student-form-input" value="${escapeHtml(s.hedefLise)}"><input id="editTargetNet" class="w-full border p-2 rounded mb-2 student-form-input" value="${s.hedefNet}"><button onclick="saveStudentEdit('${id}')" class="bg-blue-600 text-white w-full py-2 rounded">Kaydet</button><button onclick="this.closest('.fixed').remove()" class="mt-2 w-full border rounded py-2">İptal</button></div>`; 
            document.body.appendChild(modal); 
        }
        function saveStudentEdit(id) { 
            const name = document.getElementById('editName')?.value.trim(); 
            const school = document.getElementById('editSchool')?.value.trim(); 
            const target = document.getElementById('editTargetSchool')?.value.trim(); 
            const net = document.getElementById('editTargetNet')?.value.trim(); 
            if(!name || !school || !target || !net){ alert("Tüm alanlar doldurun"); return; } 
            const students = loadStudentsData(); 
            const idx = students.findIndex(s => s.id === id); 
            if(idx !== -1){ students[idx] = { ...students[idx], adSoyad:name, okul:school, hedefLise:target, hedefNet:net }; saveStudentsData(students); } 
            document.querySelector('.fixed')?.remove(); 
            renderHomeScreen(); 
        }
        function selectStudent(id){ renderStudentPanel(id); }
        async function generatePDF() { if(!currentStudentId) return; alert("PDF rapor özelliği bu sürümde test amaçlıdır."); }
        function registerPWA(){ 
            const manifest = { name:"Canfenci Deneme Analizi", short_name:"Canfenci", start_url:".", display:"standalone", theme_color:"#007BFF" }; 
            const link = document.createElement('link'); link.rel = 'manifest'; link.href = "data:application/json,"+encodeURIComponent(JSON.stringify(manifest)); 
            document.head.appendChild(link); 
            const swCode = `self.addEventListener('install',e=>self.skipWaiting()); self.addEventListener('fetch',e=>e.respondWith(fetch(e.request)));`; 
            if('serviceWorker' in navigator) navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'application/javascript'}))); 
        }

        window.renderHomeScreen = renderHomeScreen; window.selectStudent = selectStudent; window.deleteStudent = deleteStudent;
        window.addStudent = addStudent; window.editStudent = editStudent; window.saveStudentEdit = saveStudentEdit;
        window.setSortOrder = setSortOrder; window.exportBackup = exportBackup; window.showImportModal = showImportModal;
        window.importBackup = importBackup; window.showCompareModal = showCompareModal; window.closeCompareModal = closeCompareModal;
        window.renderComparison = renderComparison; window.showBatchExamModal = showBatchExamModal; window.closeBatchModal = closeBatchModal;
        window.saveBatchExam = saveBatchExam; window.generatePDF = generatePDF; window.toggleTheme = toggleTheme;
        window.editExam = editExam; window.saveExamEdit = saveExamEdit; window.deleteExam = deleteExam; window.viewExam = viewExam;
        window.copyExamToOthers = copyExamToOthers; window.executeCopyExam = executeCopyExam;

        window.onload = () => { applyTheme(); registerPWA(); renderHomeScreen(); };
    </script>
</body>
</html>
