    <script>
        // ==================== KONU LİSTELERİ (Sınıf bazlı) ====================
        // 5. Sınıf Fen Bilimleri konuları (18 konu)
        const KONU_LISTESI_SINIF5 = [
            "Gökyüzündeki Komşumuz: Güneş", "Gökyüzündeki Komşumuz: Ay", "Dünyamız ve Gökyüzündeki Komşularımız",
            "Kuvvet ve Kuvvetin Ölçülmesi", "Kütle ve Ağırlık İlişkisi", "Sürtünme Kuvveti",
            "Hücre ve Organeller", "Destek ve Hareket Sistemi", "Işığın Yayılması",
            "Işığın Madde ile Etkileşimi", "Tam Gölgenin Oluşumu", "Maddenin Tanecikli Yapısı",
            "Isı ve Sıcaklık", "Hal Değişimi", "Madde ve Isı",
            "Devre Elemanlarının Sembol ile Gösterimi", "Ampul Parlaklığını Etkileyen Değişkenler",
            "Evsel Atıklar ve Geri Dönüşüm", "Sınava Hazırlık"
        ];

        // 6. Sınıf Fen Bilimleri konuları (16 konu)
        const KONU_LISTESI_SINIF6 = [
            "Güneş Sistemi ve Gezegenler", "Güneş ve Ay Tutulmaları", "Bileşke Kuvvet", 
            "Sabit Süratli ve Sabit Hızlı Hareket", "Bitki ve Hayvanlarda Üreme, Büyüme ve Gelişme", 
            "Denetleyici ve Düzenleyici Sistem", "Işığın Yansıması", "Aynalar", 
            "Işığın Soğurulması", "Genleşme ve Büzülme", "Maddenin Hal Değişim Noktaları", 
            "Yoğunluk", "Elektriğin İletimi", "Elektriksel Direnç ve Direncin Bağlı Olduğu Faktörler", 
            "Biyoçeşitlilik", "İnsan ve Çevre Etkileşimi", "Sınava Hazırlık"
        ];

        // 7. Sınıf Fen Bilimleri konuları (17 konu)
        const KONU_LISTESI_SINIF7 = [
            "Türkiye ve Uzay Araştırmaları", "Uzayda Neler Var?", "Kuvvet, İş ve Enerji İlişkisi",
            "Enerji Dönüşümleri", "Sindirim Sistemi", "Dolaşım Sistemi", "Solunum Sistemi",
            "Boşaltım Sistemi", "Işığın Kırılması", "Mercekler", "Maddenin Tanecikli Yapısı",
            "Saf Maddeler", "Karışımlar", "Karışımların Ayrılması", "Elektrik Yükleri ve Elektriklenme",
            "Besin Zinciri ve Enerji Akışı", "Sürdürülebilir Yaşam", "Sınava Hazırlık"
        ];

        // 8. Sınıf / LGS Fen konuları (29 konu) - 8. sınıf ve diğer tüm durumlar için
        const KONU_LISTESI_LGS = [
            "Mevsimlerin oluşumu", "İklim ve Hava Hareketleri", "DNA ve Genetik Kod", "Kalıtım",
            "Mutasyon ve Modifikasyon", "Adaptasyon", "Biyoteknoloji", "Katı basıncı", "Sıvı Basıncı",
            "Gaz Basıncı", "Periyodik Cetvel", "Fiziksel ve Kimyasal Değişimler", "Kimyasal Tepkimeler",
            "Asitler ve Bazlar", "Özısı", "Maddenin Hal Değişimi", "Kimya Endüstrisi", "Kaldıraçlar",
            "Makaralar", "Eğik Düzlem ve Çıkrık", "Dişli Çark, Kasnak ve Bileşik Makine", "Besin Zinciri",
            "Fotosentez", "Solunum", "Madde Döngüleri ve Çevre Sorunları", "Sürdürülebilir Kalkınma",
            "Elektrik Yükleri ve Elektriklenme", "Elektrik Yüklü Cisimler ve Elektroskop",
            "Elektrik Enerjisinin Dönüşümü ve Güç Santralleri", "Sınava Hazırlık", "Deneme Çözümü"
        ];

        // Öğrencinin sınıfına göre konu listesini döndüren fonksiyon (GELİŞTİRİLDİ - 7. sınıf eklendi)
        function getKonuListesiBySinif(sinif) {
            const normalized = String(sinif || "").trim();
            if (normalized === "5") return KONU_LISTESI_SINIF5;
            if (normalized === "6") return KONU_LISTESI_SINIF6;
            if (normalized === "7") return KONU_LISTESI_SINIF7;
            // 8 veya diğer tüm değerler için LGS listesi döndür
            return KONU_LISTESI_LGS;
        }

        const GENEL_DERSLER_GORUNUM = [
            "Türkçe", "İnkılap Tarihi / Sosyal Bilgiler", 
            "Din Kültürü ve Ahlak Bilgisi", "Yabancı Dil (İngilizce)", 
            "Matematik", "Fen Bilimleri"
        ];
        const GENEL_DERSLER_KEY = [
            "Türkçe", "İnkılap Tarihi ve Sosyal Bilgiler", 
            "Din Kültürü ve Ahlak Bilgisi", "Yabancı Dil (İngilizce)", 
            "Matematik", "Fen Bilimleri"
        ];

        const HATA_KODLARI = [
            { kod: "BE", aciklama: "Bilgi Eksikliği" },
            { kod: "KY", aciklama: "Kavram Yanılgısı" },
            { kod: "D", aciklama: "Dikkatsizlik" },
            { kod: "YO", aciklama: "Yanlış Okuma" },
            { kod: "İH", aciklama: "İşlem Hatası" },
            { kod: "ZY", aciklama: "Zaman Yetmedi" }
        ];

        let currentStudentId = null, chartInstance = null, currentSortOrder = "default";
        let darkMode = localStorage.getItem('darkMode') === 'true';
        let currentFilterSinif = "all";
        let currentPage = "home";
        const STORAGE_KEY = "lgs_soru_bazli_v6";
        const SCHEDULE_KEY = "student_schedule";
        const DERS_KAYITLARI_KEY = "student_ders_kayitlari_v2";

        // --- Ders Kayıtları yardımcıları ---
        function loadDersKayitlari(studentId) {
            const all = localStorage.getItem(DERS_KAYITLARI_KEY);
            const data = all ? JSON.parse(all) : {};
            let kayitlar = data[studentId] || [];
            kayitlar = kayitlar.map(k => {
                if (typeof k.odev === 'string') k.odev = k.odev ? [k.odev] : [];
                if (!Array.isArray(k.odev)) k.odev = [];
                return k;
            });
            return kayitlar;
        }
        function saveDersKayitlari(studentId, lessons) {
            const all = localStorage.getItem(DERS_KAYITLARI_KEY);
            const data = all ? JSON.parse(all) : {};
            data[studentId] = lessons;
            localStorage.setItem(DERS_KAYITLARI_KEY, JSON.stringify(data));
        }
        function getDersOzet(studentId, aylikUcret) {
            const kayitlar = loadDersKayitlari(studentId);
            const toplamDers = kayitlar.length;
            const odenenDersSayisi = kayitlar.filter(k => k.odendi === true).length;
            const toplamOdeme = odenenDersSayisi * (parseFloat(aylikUcret) || 0);
            return { toplamDers, odenenDersSayisi, toplamOdeme };
        }

        function calculateNet(dogru, yanlis) { let net = dogru - (yanlis/3); return net>0 ? parseFloat(net.toFixed(2)) : 0; }
        function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
        function showSyncStatus(msg, isError) { const el = document.getElementById('syncStatus'); if(el){ el.textContent = msg; el.classList.remove('hidden','bg-gray-800','bg-red-600'); el.classList.add(isError?'bg-red-600':'bg-gray-800'); setTimeout(()=>el.classList.add('hidden'),3000); } }

        function normalizeStudent(s) {
            if (s.sinif === undefined) s.sinif = "";
            if (s.ucret === undefined) s.ucret = "";
            if (s.veliTel === undefined) s.veliTel = "";
            return s;
        }

        function loadStudentsData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if(stored) { 
                    let data = JSON.parse(stored);
                    if (Array.isArray(data)) { data = data.map(normalizeStudent); return data; }
                }
            } catch(e) {}
            return [{ id:"s1", adSoyad:"Zeynep Demir", sinif:"8", okul:"Mehmetçik Ortaokulu", hedefLise:"İstanbul Lisesi", hedefNet:"18.5", ucret:"", veliTel:"", denemeler:[] }];
        }
        function saveStudentsData(students) { localStorage.setItem(STORAGE_KEY, JSON.stringify(students)); showSyncStatus("✅ Kaydedildi", false); }

        function loadSchedule(studentId) {
            const all = localStorage.getItem(SCHEDULE_KEY);
            const schedules = all ? JSON.parse(all) : {};
            return schedules[studentId] || [];
        }
        function saveSchedule(studentId, lessons) {
            const all = localStorage.getItem(SCHEDULE_KEY);
            const schedules = all ? JSON.parse(all) : {};
            schedules[studentId] = lessons;
            localStorage.setItem(SCHEDULE_KEY, JSON.stringify(schedules));
        }

        // --- İstatistik fonksiyonları (sınıf bazlı konulara göre) ---
        function getKonuBazliBasarilar(ogrenci) {
            const konuList = getKonuListesiBySinif(ogrenci.sinif);
            const stats = {};
            konuList.forEach(k => stats[k] = { dogru: 0, toplamSoru: 0 });
            if(!ogrenci.denemeler) return stats;
            for(let den of ogrenci.denemeler) {
                if(den.tip === "genel") continue;
                for(let soru of den.sorular) {
                    const konu = soru.konuAdi;
                    if(stats[konu]) {
                        stats[konu].toplamSoru++;
                        if(soru.durum === "dogru") stats[konu].dogru++;
                    }
                }
            }
            const basari = {};
            for(let k of konuList) {
                basari[k] = stats[k].toplamSoru ? (stats[k].dogru / stats[k].toplamSoru) * 100 : null;
            }
            return basari;
        }
        function getOrtalamaNet(ogrenci) { const d = ogrenci.denemeler || []; if(!d.length) return 0; const toplam = d.reduce((s,e)=>s + (e.toplamNet || 0), 0); return parseFloat((toplam/d.length).toFixed(2)); }
        function getBransOrtalamaNet(ogrenci) { const br = (ogrenci.denemeler||[]).filter(d=>d.tip==="branş"); if(!br.length) return null; return parseFloat((br.reduce((s,d)=>s+d.toplamNet,0)/br.length).toFixed(2)); }
        function getGenelOrtalamaNet(ogrenci) { const gn = (ogrenci.denemeler||[]).filter(d=>d.tip==="genel"); if(!gn.length) return null; return parseFloat((gn.reduce((s,d)=>s+d.toplamNet,0)/gn.length).toFixed(2)); }
        function getTYMMFeedback(y) { if(y===null) return {etiket:"Veri Yok"}; if(y<50) return {etiket:"Destekleme Gerekli"}; if(y<=80) return {etiket:"Geliştirilebilir"}; return {etiket:"Zenginleştirme"}; }
        function getBestWorstTopics(b) { 
            const entries = Object.entries(b).filter(([_,v])=>v!==null); 
            if(!entries.length) return {zayif:[], guclu:[]}; 
            const sorted = [...entries].sort((a,b)=>a[1]-b[1]); 
            return {zayif: sorted.slice(0,3).map(([k,v])=>({konu:k, yuzde:v.toFixed(1)})), guclu: sorted.slice(-3).reverse().map(([k,v])=>({konu:k, yuzde:v.toFixed(1)}))}; 
        }
        function getMotivationMessage(s) { const d=s.denemeler||[]; if(!d.length) return "📝 İlk denemeyi ekleyin"; const sonNet = d[d.length-1].toplamNet; const hedef = parseFloat(s.hedefNet); if(isNaN(hedef)) return "🎯 Hedef net belirtilmemiş"; const fark = hedef - sonNet; if(fark<=0) return "🎉 Hedefine ulaştın!"; if(fark<=2) return `🚀 Hedefine ${fark.toFixed(1)} net kaldı`; if(fark<=5) return `💪 ${fark.toFixed(1)} net kaldı`; return `📈 Hedefine ${fark.toFixed(1)} net var.`; }
        function getHataIstatistikleri(ogrenci) {
            const hataSayilari = {}; HATA_KODLARI.forEach(h => hataSayilari[h.kod] = 0);
            let toplamHata = 0;
            if(!ogrenci.denemeler) return { hataSayilari, toplamHata };
            for(let den of ogrenci.denemeler) {
                if(den.tip === "genel") continue;
                for(let soru of den.sorular) {
                    if((soru.durum === "yanlis" || soru.durum === "bos") && soru.hataKodu) {
                        hataSayilari[soru.hataKodu]++;
                        toplamHata++;
                    }
                }
            }
            return { hataSayilari, toplamHata };
        }
        function lgsPuanHesapla(genelDenemeler) {
            if(!genelDenemeler || genelDenemeler.length === 0) return null;
            let toplamNet = 0;
            for(let den of genelDenemeler) toplamNet += den.toplamNet;
            const ortalamaNet = toplamNet / genelDenemeler.length;
            return Math.round(ortalamaNet * 5.2);
        }

        // Yedekleme / Geri yükleme
        function exportBackup() { const data=loadStudentsData(); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})); a.download="lgs_manuel_yedek.json"; a.click(); }
        function showImportModal() { 
            const modal=document.createElement('div'); modal.className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"; 
            modal.innerHTML=`<div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-md shadow-xl"><h2 class="text-xl font-bold">📂 Manuel Geri Yükle</h2><input type="file" id="restoreFile" accept=".json" class="w-full border p-2 rounded my-2"><button onclick="importBackup()" class="bg-blue-600 text-white w-full py-2 rounded">Yükle</button><button onclick="this.closest('.fixed').remove()" class="mt-2 w-full border rounded py-2">İptal</button></div>`; 
            document.body.appendChild(modal); 
        }
        function importBackup() { 
            const file=document.getElementById('restoreFile').files[0]; 
            if(!file) return; 
            const reader=new FileReader(); 
            reader.onload=e=>{ 
                try{ 
                    const data=JSON.parse(e.target.result); 
                    if(Array.isArray(data)){ 
                        saveStudentsData(data.map(normalizeStudent)); 
                        alert("Veriler yüklendi!"); 
                        document.querySelector('.fixed')?.remove(); 
                        renderHomeScreen(); 
                    } 
                } catch(err){ alert("Geçersiz dosya"); } 
            }; 
            reader.readAsText(file); 
        }

        function closeDenemeAtaModal() { document.getElementById('denemeAtaModal')?.remove(); }
        function saveDenemeAta() {
            const examName = document.getElementById('denemeAtaExamName')?.value.trim();
            if(!examName){ alert("Deneme adı girin"); return; }
            const selectedStudents = Array.from(document.querySelectorAll('.studentCheck:checked')).map(cb=>cb.value);
            if(selectedStudents.length===0){ alert("En az bir öğrenci seçin"); return; }
            let sorular = [], tip = "";
            if(denemeAtaMode === 'branş') {
                const soruSayisi = parseInt(document.getElementById('bransSoruSayisi')?.value) || 0;
                if(soruSayisi < 1){ alert("En az 1 soru olmalı"); return; }
                for(let i=0; i<soruSayisi; i++) {
                    sorular.push({ soruNo: i+1, konuAdi: "", durum: "bos", hataKodu: null });
                }
                tip = "branş";
            } else {
                let dersList = [];
                for(let i=0; i<GENEL_DERSLER_KEY.length; i++) {
                    const dersKey = GENEL_DERSLER_KEY[i];
                    const adet = parseInt(document.querySelector(`.genelDersInput[data-ders="${dersKey}"]`)?.value) || 0;
                    if(adet > 0) dersList.push({ ders: dersKey, adet });
                }
                if(dersList.length===0){ alert("En az bir ders için soru sayısı girin"); return; }
                let soruNo = 1;
                for(let item of dersList) for(let i=0;i<item.adet;i++) sorular.push({ soruNo: soruNo++, konuAdi: item.ders, durum: "bos", hataKodu: null });
                tip = "genel";
            }
            const newExam = { id: "ex_"+Date.now(), denemeAdi: examName, tarih: new Date().toISOString().slice(0,10), tip: tip, sorular: sorular, toplamDogru: 0, toplamYanlis: 0, toplamBos: sorular.length, toplamNet: 0, toplamSoru: sorular.length };
            if(tip === "genel") {
                newExam.dersBilgileri = [];
                newExam.dersSonuclari = {};
                const dersMap = {};
                for(let s of sorular) dersMap[s.konuAdi] = (dersMap[s.konuAdi]||0)+1;
                for(let d in dersMap) { newExam.dersBilgileri.push({ ders:d, adet:dersMap[d] }); newExam.dersSonuclari[d] = { dogru:0, yanlis:0, bos:dersMap[d] }; }
            }
            const students = loadStudentsData();
            for(let sid of selectedStudents){
                const idx = students.findIndex(s=>s.id===sid);
                if(idx !== -1){
                    if(!students[idx].denemeler) students[idx].denemeler = [];
                    students[idx].denemeler.push(JSON.parse(JSON.stringify(newExam)));
                }
            }
            saveStudentsData(students);
            alert(`${selectedStudents.length} öğrenciye deneme eklendi.`);
            closeDenemeAtaModal();
            renderHomeScreen();
        }

                for(let i=0; i<soruSayisi; i++) {
                    const durumSelect = document.querySelector(`.durum-select[data-index="${i}"]`);
                    if(durumSelect) {
                        const durum = durumSelect.value;
                        if(durum === 'dogru') totalDogru++;
                        else if(durum === 'yanlis') totalYanlis++;
                        else totalBos++;
                    } else {

                        if(soru.durum === 'dogru') totalDogru++;

        function saveBransExamEdit(studentId, examId) {
            const examName = document.getElementById('editExamName')?.value.trim();
            if(!examName) { alert("Deneme adı girin"); return; }
            const students = loadStudentsData();
            const sIdx = students.findIndex(s => s.id === studentId);
            if(sIdx === -1) { renderHomeScreen(); return; }
            const examIndex = students[sIdx].denemeler.findIndex(e => e.id === examId);
            if(examIndex === -1) { renderHomeScreen(); return; }
            const exam = students[sIdx].denemeler[examIndex];
            const soruSayisi = exam.sorular.length;
            let toplamDogru=0, toplamYanlis=0, toplamBos=0;
            const updatedSorular = [];
            let hataEksik = false;
            for(let i=0; i<soruSayisi; i++) {
                const durumSelect = document.querySelector(`.durum-select[data-index="${i}"]`);
                const konuSelect = document.querySelector(`.konu-select[data-index="${i}"]`);
                const hataSelect = document.querySelector(`.hata-select[data-index="${i}"]`);
                let durum = durumSelect ? durumSelect.value : exam.sorular[i].durum;
                let konu = "";
                let hataKodu = null;
                if(durum === 'dogru') {
                    toplamDogru++;
                } else {
                    if(konuSelect) konu = konuSelect.value;
                    if(hataSelect) hataKodu = hataSelect.value;
                    if(!konu) hataEksik = true;
                    if(durum === 'yanlis') toplamYanlis++;
                    else toplamBos++;
                }
                updatedSorular.push({
                    soruNo: i+1,
                    konuAdi: konu || "",
                    durum: durum,
                    hataKodu: hataKodu || null
                });
            }
            if(hataEksik) {
                alert("Lütfen tüm yanlış veya boş sorular için konu seçiniz!");
                return;
            }
            const net = calculateNet(toplamDogru, toplamYanlis);
            students[sIdx].denemeler[examIndex] = {
                ...exam,
                denemeAdi: examName,
                sorular: updatedSorular,
                toplamDogru, toplamYanlis, toplamBos, toplamNet: net, toplamSoru: soruSayisi
            };
            saveStudentsData(students);
            renderStudentPanel(studentId);
        }

        function editGenelExam(studentId, examId, exam) {

            const dersSonuclari = exam.dersSonuclari || {};
            for(let item of dersBilgileri) {
                const dersKey = item.ders;
                const idx = GENEL_DERSLER_KEY.indexOf(dersKey);
                const dersGorunum = idx !== -1 ? GENEL_DERSLER_GORUNUM[idx] : dersKey;
                const toplamSoru = item.adet;
                const sonuc = dersSonuclari[dersKey] || { dogru: 0, yanlis: 0, bos: toplamSoru };
                dersRows += `
                    <div class="border rounded-xl p-3 bg-white dark:bg-gray-800">
                        <div class="font-bold mb-2">${dersGorunum}</div>
                        <div class="text-sm text-gray-500 mb-2">Toplam Soru: ${toplamSoru}</div>
                        <div class="grid grid-cols-3 gap-3">
                            <div><label class="text-xs">Doğru</label><input type="number" min="0" max="${toplamSoru}" value="${sonuc.dogru}" class="w-full border rounded p-1 genel-dogru" data-ders="${dersKey}" data-toplam="${toplamSoru}"></div>
                            <div><label class="text-xs">Yanlış</label><input type="number" min="0" max="${toplamSoru}" value="${sonuc.yanlis}" class="w-full border rounded p-1 genel-yanlis" data-ders="${dersKey}" data-toplam="${toplamSoru}"></div>
                            <div><label class="text-xs">Boş</label><input type="number" min="0" max="${toplamSoru}" value="${sonuc.bos}" class="w-full border rounded p-1 genel-bos" data-ders="${dersKey}" data-toplam="${toplamSoru}" readonly></div>
                        </div>
                    </div>
                `;
            }
            const html = `
                <div><button onclick="renderStudentPanel('${studentId}')" class="text-blue-600 mb-2 inline-block">← Geri</button>
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-5">
                    <h2 class="text-xl font-bold mb-3">Genel Deneme Düzenle - ${escapeHtml(exam.denemeAdi)}</h2>
                    <input id="editExamName" class="w-full border rounded p-2 mb-3 modal-input" placeholder="Deneme Adı" value="${escapeHtml(exam.denemeAdi)}">
                    <div class="mb-2 text-sm text-gray-500">Her ders için doğru, yanlış ve boş sayılarını girin. Boş sayısı otomatik hesaplanır.</div>
                    <div class="space-y-3 max-h-96 overflow-auto mb-3">${dersRows}</div>
                    <div class="sticky-footer p-3 bg-gray-100 dark:bg-gray-700 rounded-xl flex justify-between font-semibold" id="editFooter">
                        <span>📊 Toplam: ${exam.toplamSoru} soru | D:${exam.toplamDogru} Y:${exam.toplamYanlis} B:${exam.toplamBos}</span>
                        <span class="text-blue-600">Net: ${exam.toplamNet.toFixed(2)}</span>
                    </div>
                    <button onclick="saveGenelExamEdit('${studentId}', '${examId}')" class="mt-4 w-full bg-blue-600 text-white py-2 rounded-xl font-bold">Güncelle</button>
                </div></div>
            `;
            document.getElementById("dynamic-content").innerHTML = html;
            
            const dogruInputs = document.querySelectorAll('.genel-dogru');
            const yanlisInputs = document.querySelectorAll('.genel-yanlis');
            const bosInputs = document.querySelectorAll('.genel-bos');
            
            function updateDers(dogruInput, yanlisInput, bosInput, toplam) {
                let dogru = parseInt(dogruInput.value) || 0;
                let yanlis = parseInt(yanlisInput.value) || 0;
                if(dogru > toplam) dogru = toplam;
                if(yanlis > toplam - dogru) yanlis = toplam - dogru;
                dogruInput.value = dogru;
                yanlisInput.value = yanlis;
                bosInput.value = toplam - dogru - yanlis;
            }
            
            function updateAll() {
                let totalDogru = 0, totalYanlis = 0, totalBos = 0;
                dogruInputs.forEach((inp, idx) => {
                    const toplam = parseInt(inp.getAttribute('data-toplam'));
                    const yanlisInp = yanlisInputs[idx];
                    const bosInp = bosInputs[idx];
                    const dogru = parseInt(inp.value) || 0;
                    const yanlis = parseInt(yanlisInp.value) || 0;
                    totalDogru += dogru;
                    totalYanlis += yanlis;
                    totalBos += toplam - dogru - yanlis;
                });
                const net = calculateNet(totalDogru, totalYanlis);
                const footer = document.getElementById('editFooter');
                if(footer) footer.innerHTML = `<span>📊 Toplam: ${exam.toplamSoru} soru | D:${totalDogru} Y:${totalYanlis} B:${totalBos}</span><span class="text-blue-600">Net: ${net.toFixed(2)}</span>`;
            }
            
            for(let i=0; i<dogruInputs.length; i++) {
                const toplam = parseInt(dogruInputs[i].getAttribute('data-toplam'));

        function saveGenelExamEdit(studentId, examId) {
            const examName = document.getElementById('editExamName')?.value.trim();
            if(!examName) { alert("Deneme adı girin"); return; }
            const students = loadStudentsData();
            const sIdx = students.findIndex(s => s.id === studentId);
            if(sIdx === -1) { renderHomeScreen(); return; }
            const examIndex = students[sIdx].denemeler.findIndex(e => e.id === examId);
            if(examIndex === -1) { renderHomeScreen(); return; }
            const exam = students[sIdx].denemeler[examIndex];
            
            const dersBilgileri = exam.dersBilgileri || [];
            const dersSonuclari = {};
            let toplamDogru = 0, toplamYanlis = 0, toplamBos = 0;
            
            for(let item of dersBilgileri) {
                const dersKey = item.ders;
                const toplamSoru = item.adet;
                const dogruInput = document.querySelector(`.genel-dogru[data-ders="${dersKey}"]`);
                const yanlisInput = document.querySelector(`.genel-yanlis[data-ders="${dersKey}"]`);
                if(!dogruInput) continue;
                let dogru = parseInt(dogruInput.value) || 0;
                let yanlis = parseInt(yanlisInput.value) || 0;
                if(dogru > toplamSoru) dogru = toplamSoru;
                if(yanlis > toplamSoru - dogru) yanlis = toplamSoru - dogru;
                const bos = toplamSoru - dogru - yanlis;
                dersSonuclari[dersKey] = { dogru, yanlis, bos };
                toplamDogru += dogru;
                toplamYanlis += yanlis;
                toplamBos += bos;
            }
            const net = calculateNet(toplamDogru, toplamYanlis);
            
            const updatedSorular = [];
            let soruIndex = 0;
            for(let item of dersBilgileri) {
                const dersKey = item.ders;
                const sonuc = dersSonuclari[dersKey];
                const adet = item.adet;
                let dogruKalan = sonuc.dogru;
                let yanlisKalan = sonuc.yanlis;
                let bosKalan = sonuc.bos;
                for(let i=0; i<adet; i++) {
                    let durum = "";
                    if(dogruKalan > 0) { durum = "dogru"; dogruKalan--; }
                    else if(yanlisKalan > 0) { durum = "yanlis"; yanlisKalan--; }
                    else { durum = "bos"; bosKalan--; }
                    updatedSorular.push({
                        soruNo: soruIndex+1,
                        konuAdi: dersKey,
                        durum: durum,
                        hataKodu: null
                    });
                    soruIndex++;
                }
            }
            
            students[sIdx].denemeler[examIndex] = {
                ...exam,
                denemeAdi: examName,
                sorular: updatedSorular,
                dersSonuclari: dersSonuclari,
                toplamDogru, toplamYanlis, toplamBos, toplamNet: net, toplamSoru: exam.toplamSoru
            };
            saveStudentsData(students);
            renderStudentPanel(studentId);
        }

            const filterHtml = `<div class="flex gap-2 mb-4 flex-wrap"><button onclick="setFilter('all')" class="px-3 py-1 rounded-full text-sm font-medium ${activeFilter === 'all' ? 'filter-btn-active' : 'filter-btn-inactive'}">Tümü</button><button onclick="setFilter('5')" class="px-3 py-1 rounded-full text-sm font-medium ${activeFilter === '5' ? 'filter-btn-active' : 'filter-btn-inactive'}">5. Sınıf</button><button onclick="setFilter('6')" class="px-3 py-1 rounded-full text-sm font-medium ${activeFilter === '6' ? 'filter-btn-active' : 'filter-btn-inactive'}">6. Sınıf</button><button onclick="setFilter('7')" class="px-3 py-1 rounded-full text-sm font-medium ${activeFilter === '7' ? 'filter-btn-active' : 'filter-btn-inactive'}">7. Sınıf</button><button onclick="setFilter('8')" class="px-3 py-1 rounded-full text-sm font-medium ${activeFilter === '8' ? 'filter-btn-active' : 'filter-btn-inactive'}">8. Sınıf</button></div>`;
            const sortHtml = `<div class="flex gap-2 mb-4 flex-wrap"><button onclick="setSortOrder('default')" class="px-3 py-1 rounded-full text-sm font-medium ${currentSortOrder==='default'?'btn-sort-active':'btn-sort-inactive'}">Varsayılan</button><button onclick="setSortOrder('net-desc')" class="px-3 py-1 rounded-full text-sm font-medium ${currentSortOrder==='net-desc'?'btn-sort-active':'btn-sort-inactive'}">Ort.Net (Yüksek↓)</button><button onclick="setSortOrder('net-asc')" class="px-3 py-1 rounded-full text-sm font-medium ${currentSortOrder==='net-asc'?'btn-sort-active':'btn-sort-inactive'}">Ort.Net (Düşük↑)</button></div>`;
            let studentsHtml = sorted.length===0 ? '<div class="bg-white rounded-2xl shadow p-6 text-center">Öğrenci yok</div>' : sorted.map(s => { 
                const son = s.denemeler?.length ? s.denemeler[s.denemeler.length-1].toplamNet : null; 
                const bransOrt = getBransOrtalamaNet(s);
                const genelOrt = getGenelOrtalamaNet(s);
                const sinifGoster = s.sinif ? `${s.sinif}. Sınıf` : "Sınıf belirtilmemiş";
                return `<div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-5 relative">
                    <div onclick="selectStudent('${s.id}')" class="cursor-pointer">
                        <h3 class="text-xl font-bold">${escapeHtml(s.adSoyad)}</h3>
                        <p class="text-gray-600 dark:text-gray-300">${escapeHtml(s.okul)} | ${sinifGoster}</p>
                        <p class="text-blue-600 font-semibold">🎯 ${s.hedefNet}</p>
                        <div class="flex flex-wrap gap-2 mt-1">
                            ${bransOrt !== null ? `<span class="stat-badge">🔬 Branş Ort: ${bransOrt}</span>` : ''}
                            ${genelOrt !== null ? `<span class="stat-badge">📘 Genel Ort: ${genelOrt}</span>` : ''}
                            ${son !== null ? `<span class="stat-badge">📈 Son Net: ${son}</span>` : ''}
                        </div>
                    </div>
                    <div class="absolute top-2 right-2 flex gap-2"><button onclick="editStudent('${s.id}')" class="text-blue-500">✏️</button><button onclick="deleteStudent('${s.id}')" class="text-red-500">🗑️</button></div>
                    <div class="text-xs text-gray-400 dark:text-gray-500 mt-2">📌 ${s.denemeler?.length||0} deneme</div>
                </div>`; 
            }).join('');
            const addButtonHtml = `<div class="mb-4 flex justify-end"><button onclick="showAddStudentModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl shadow"><i class="fas fa-plus"></i> Yeni Öğrenci Ekle</button></div>`;
            document.getElementById("dynamic-content").innerHTML = `<div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow mb-4"><h2 class="text-xl font-bold">📋 Öğrenci Listesi</h2><p class="text-sm text-gray-500">Toplam ${sorted.length} öğrenci (${activeFilter === 'all' ? 'Tümü' : activeFilter+'. sınıf'})</p></div>${addButtonHtml}${filterHtml}${sortHtml}<div class="grid md:grid-cols-2 gap-5">${studentsHtml}</div>`;
        }
        
        function getSortedStudents(students, order) { 
            if(order === 'default') return [...students]; 
            const withAvg = students.map(s => ({ ...s, ortalamaNet: getOrtalamaNet(s) })); 
            if(order === 'net-desc') return withAvg.sort((a,b) => b.ortalamaNet - a.ortalamaNet); 
            if(order === 'net-asc') return withAvg.sort((a,b) => a.ortalamaNet - b.ortalamaNet); 
            return students; 
        }
        function setSortOrder(order){ currentSortOrder = order; renderHomeScreen(); }
        function toggleTheme(){ 
            darkMode = !darkMode; 
            localStorage.setItem('darkMode', darkMode); 
            applyTheme(); 
            if (currentPage === 'home') renderHomeScreen();
            else if (currentPage === 'schedule') renderSchedulePage();
            else if (currentPage === 'student' && currentStudentId) renderStudentPanel(currentStudentId);
            else if (currentPage === 'dersKayitlari') renderDersKayitlari();
            else if (currentPage === 'dersDetay' && window._currentDersKayitStudentId) renderDersDetay(window._currentDersKayitStudentId);
            else renderHomeScreen();
            const themeBtn = document.getElementById('themeBtnText'); if(themeBtn) themeBtn.textContent = darkMode ? 'Açık Mod' : 'Koyu Mod'; 
        }
        function applyTheme(){ if(darkMode) document.body.classList.add('dark'); else document.body.classList.remove('dark'); }
        function deleteStudent(id) { if(confirm("Öğrenciyi sil?")){ let students = loadStudentsData().filter(s => s.id !== id); saveStudentsData(students); if(currentStudentId === id) renderHomeScreen(); else renderHomeScreen(); } }
        function editStudent(id) { 
            const s = loadStudentsData().find(s => s.id === id); if(!s) return; 
            const sinifOptions = ['5','6','7','8'].map(sinif => `<option value="${sinif}" ${s.sinif === sinif ? 'selected' : ''}>${sinif}. Sınıf</option>`).join('');
            const modal = document.createElement('div'); modal.className = "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"; 
            modal.innerHTML = `<div class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-md"><h2 class="text-xl font-bold">✏️ Düzenle</h2><input id="editName" class="w-full border p-2 rounded mb-2 student-form-input" value="${escapeHtml(s.adSoyad)}" required><input id="editSchool" class="w-full border p-2 rounded mb-2 student-form-input" value="${escapeHtml(s.okul)}" required><select id="editSinif" class="w-full border p-2 rounded mb-2 student-form-input" required><option value="" disabled>Sınıf Seçin (zorunlu)</option>${sinifOptions}</select><input id="editTargetSchool" class="w-full border p-2 rounded mb-2 student-form-input" value="${escapeHtml(s.hedefLise)}" required><input id="editTargetNet" class="w-full border p-2 rounded mb-2 student-form-input" value="${s.hedefNet}" required><input id="editUcret" class="w-full border p-2 rounded mb-2 student-form-input" placeholder="Aylık Ücret (TL)" value="${escapeHtml(s.ucret)}"><input id="editVeliTel" class="w-full border p-2 rounded mb-2 student-form-input" placeholder="Veli Telefonu" value="${escapeHtml(s.veliTel)}"><button onclick="saveStudentEdit('${id}')" class="bg-blue-600 text-white w-full py-2 rounded">Kaydet</button><button onclick="this.closest('.fixed').remove()" class="mt-2 w-full border rounded py-2">İptal</button></div>`; 
            document.body.appendChild(modal); 
        }
        function saveStudentEdit(id) { 
            const name = document.getElementById('editName')?.value.trim(); 
            const school = document.getElementById('editSchool')?.value.trim(); 
            const sinif = document.getElementById('editSinif')?.value; 
            const target = document.getElementById('editTargetSchool')?.value.trim(); 
            const net = document.getElementById('editTargetNet')?.value.trim(); 
            const ucret = document.getElementById('editUcret')?.value.trim();
            const veliTel = document.getElementById('editVeliTel')?.value.trim();
            if(!name || !school || !sinif || !target || !net){ alert("Ad, Okul, Sınıf, Hedef Lise ve Hedef Net zorunludur"); return; } 
            const students = loadStudentsData(); 
            const idx = students.findIndex(s => s.id === id); 
            if(idx !== -1){ students[idx] = { ...students[idx], adSoyad:name, sinif: sinif, okul:school, hedefLise:target, hedefNet:net, ucret: ucret || "", veliTel: veliTel || "" }; saveStudentsData(students); } 
            document.querySelector('.fixed')?.remove(); 
            renderHomeScreen(); 
        }

        // ========== YENİ: DERS PROGRAMI EKLEME MODALI ==========
        function showAddScheduleModal(studentId) {
            const gunler = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
            const saatler = [];
            for (let h = 0; h < 24; h++) for (let m = 0; m < 60; m += 30) saatler.push(`${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`);
            
            const modalHtml = `
                <div id="addScheduleModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onclick="if(event.target===this) closeAddScheduleModal()">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full p-6 shadow-xl" onclick="event.stopPropagation()">
                        <h2 class="text-xl font-bold mb-4">📅 Yeni Ders Ekle</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Gün</label>
                                <select id="modalScheduleDay" class="student-form-input">
                                    ${gunler.map(g => `<option value="${g}">${g}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Saat</label>
                                <select id="modalScheduleTime" class="student-form-input">
                                    ${saatler.map(s => `<option value="${s}">${s}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Ders Adı</label>
                                <input type="text" id="modalScheduleLessonName" class="student-form-input" placeholder="Örn: Matematik">
                            </div>
                            <button onclick="addScheduleFromModal('${studentId}')" class="w-full bg-blue-600 text-white py-2 rounded-xl font-semibold mt-2">Ekle</button>
                            <button onclick="closeAddScheduleModal()" class="w-full border border-gray-300 dark:border-gray-600 py-2 rounded-xl">İptal</button>
                        </div>
                    </div>
                </div>
            `;
            const existing = document.getElementById('addScheduleModal'); if(existing) existing.remove();
            const modalDiv = document.createElement('div'); modalDiv.id = 'addScheduleModal'; modalDiv.innerHTML = modalHtml; document.body.appendChild(modalDiv);
        }
        
        function closeAddScheduleModal() {
            document.getElementById('addScheduleModal')?.remove();
        }
        
        function addScheduleFromModal(studentId) {
            const gun = document.getElementById('modalScheduleDay')?.value;
            const saat = document.getElementById('modalScheduleTime')?.value;
            const dersAdi = document.getElementById('modalScheduleLessonName')?.value.trim();
            if (!dersAdi) { alert("Ders adı giriniz"); return; }
            // Çakışma kontrolü
            const lessons = loadSchedule(studentId);
            const conflict = lessons.some(lesson => lesson.gun === gun && lesson.saat === saat);
            if (conflict) { alert("Bu gün ve saatte zaten bir ders var!"); return; }
            lessons.push({ gun, saat, dersAdi });
            saveSchedule(studentId, lessons);
            closeAddScheduleModal();
            renderSchedulePage(); // sayfayı yenile
        }

        // DERS PROGRAMI SAYFASI (GÜNCELLENDİ: Ekleme butonu ve modal)
        function renderSchedulePage() {
            currentPage = "schedule";
            const students = loadStudentsData();
            if (students.length === 0) {
                document.getElementById("dynamic-content").innerHTML = `<div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-6 text-center text-gray-500">Henüz öğrenci eklenmemiş. Lütfen önce öğrenci ekleyin.</div>`;
                return;
            }
            let selectedStudentId = students[0].id;
            let lessons = loadSchedule(selectedStudentId);
            let editingIndex = -1;
            
            function buildUI() {
                const gunler = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
                const saatler = [];
                for (let h = 0; h < 24; h++) for (let m = 0; m < 60; m += 30) saatler.push(`${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`);
                
                let allSchedules = [];
                for (let s of students) { let sch = loadSchedule(s.id); for (let item of sch) allSchedules.push({ ogrenciAd: s.adSoyad, ogrenciId: s.id, gun: item.gun, saat: item.saat, dersAdi: item.dersAdi }); }
                const gunSirasi = { "Pazartesi":1, "Salı":2, "Çarşamba":3, "Perşembe":4, "Cuma":5, "Cumartesi":6, "Pazar":7 };
                allSchedules.sort((a,b) => (gunSirasi[a.gun] - gunSirasi[b.gun]) || (a.saat.localeCompare(b.saat)));
                
                const html = `
                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6">
                        <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">📅 Haftalık Ders Programı</h2>
                        <p class="text-gray-500 dark:text-gray-400 mb-6">Öğrencilerin ders programlarını yönetin ve tüm programları toplu görün.</p>
                        <div class="mb-8 bg-gray-50 dark:bg-gray-900 rounded-xl p-4">
                            <h3 class="text-lg font-semibold mb-3 flex items-center"><i class="fas fa-user-graduate mr-2 text-blue-500"></i> ${escapeHtml(students.find(s=>s.id===selectedStudentId)?.adSoyad || 'Seçili Öğrenci')} - Ders Programı Düzenle</h3>
                            <div class="flex flex-wrap gap-4 items-end mb-4">
                                <div class="flex-1 min-w-[200px]"><label class="font-medium block mb-1">Öğrenci Değiştir</label><select id="scheduleStudentSelect" class="student-form-input w-full">${students.map(s => `<option value="${s.id}" ${s.id === selectedStudentId ? 'selected' : ''}>${escapeHtml(s.adSoyad)} (${escapeHtml(s.okul)})</option>`).join('')}</select></div>
                                <div><button onclick="showAddScheduleModal('${selectedStudentId}')" class="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2 rounded-xl transition"><i class="fas fa-plus-circle mr-1"></i> Ders Programı Ekle</button></div>
                            </div>
                            <div class="overflow-x-auto"><table class="w-full border-collapse border border-gray-300 dark:border-gray-700 rounded-lg"><thead class="bg-gray-100 dark:bg-gray-700"><tr><th class="border p-2">Gün</th><th class="border p-2">Saat</th><th class="border p-2">Ders</th><th class="border p-2">İşlemler</th></tr></thead><tbody id="scheduleTableBody">${lessons.map((les, idx) => `<tr><td class="border p-2">${escapeHtml(les.gun)}</td><td class="border p-2">${escapeHtml(les.saat)}</td><td class="border p-2">${escapeHtml(les.dersAdi)}</td><td class="border p-2"><button onclick="editScheduleLesson(${idx})" class="text-blue-500 mr-2"><i class="fas fa-edit"></i></button><button onclick="deleteScheduleLesson(${idx})" class="text-red-500"><i class="fas fa-trash"></i></button></td></tr>`).join('')}${lessons.length === 0 ? '<tr><td colspan="4" class="text-center p-4 text-gray-500">Henüz ders eklenmemiş.</td></tr>' : ''}</tbody>}</div>
                            <div class="mt-4 flex justify-end"><button id="cancelEditBtn" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-xl hidden">Düzenlemeyi İptal Et</button></div>
                        </div>
                        <div class="mt-8"><h3 class="text-xl font-bold mb-3 text-gray-800 dark:text-white">📋 Tüm Öğrencilerin Ders Programı</h3><div class="overflow-x-auto"><table class="w-full border-collapse border border-gray-300 dark:border-gray-700 rounded-lg"><thead class="bg-gray-100 dark:bg-gray-700"><tr><th class="border p-2">Öğrenci</th><th class="border p-2">Gün</th><th class="border p-2">Saat</th><th class="border p-2">Ders</th></tr></thead><tbody>${allSchedules.map(sch => `<tr><td class="border p-2">${escapeHtml(sch.ogrenciAd)}</td><td class="border p-2">${escapeHtml(sch.gun)}</td><td class="border p-2">${escapeHtml(sch.saat)}</td><td class="border p-2">${escapeHtml(sch.dersAdi)}</td></tr>`).join('')}${allSchedules.length === 0 ? '<tr><td colspan="4" class="text-center p-4 text-gray-500">Henüz hiçbir öğrenci için ders eklenmemiş.</td></tr>' : ''}</tbody>}</div></div>
                    </div>
                `;
                document.getElementById("dynamic-content").innerHTML = html;
                
                // Öğrenci değiştirme eventi
                document.getElementById("scheduleStudentSelect").addEventListener("change", (e) => {
                    selectedStudentId = e.target.value;
                    lessons = loadSchedule(selectedStudentId);
                    editingIndex = -1;
                    buildUI();
                });
                
                // Düzenleme işlevleri (eski mantık, aynen korundu)
                window.editScheduleLesson = (idx) => {
                    const les = lessons[idx];
                    // Mevcut inline düzenleme için gün/saat/ders alanları oluştur (basitçe prompt kullanılabilir, ancak orijinal yapı korunsun)
                    const yeniGun = prompt("Gün (Pazartesi, Salı...):", les.gun);
                    const yeniSaat = prompt("Saat (HH:MM):", les.saat);
                    const yeniDers = prompt("Ders Adı:", les.dersAdi);
                    if (yeniGun && yeniSaat && yeniDers) {
                        // çakışma kontrolü (kendisi hariç)
                        const conflict = lessons.some((l, i) => i !== idx && l.gun === yeniGun && l.saat === yeniSaat);
                        if (conflict) { alert("Bu gün ve saatte başka bir ders var!"); return; }
                        lessons[idx] = { gun: yeniGun, saat: yeniSaat, dersAdi: yeniDers };
                        saveSchedule(selectedStudentId, lessons);
                        buildUI();
                    }
                };
                window.deleteScheduleLesson = (idx) => {
                    if (confirm("Bu dersi silmek istediğinize emin misiniz?")) {
                        lessons.splice(idx, 1);
                        saveSchedule(selectedStudentId, lessons);
                        buildUI();
                    }
                };
                // İptal butonu (edit modu için kullanılmıyor artık, ama varsa gizle)
                const cancelBtn = document.getElementById("cancelEditBtn");
                if (cancelBtn) cancelBtn.classList.add("hidden");
            }
            buildUI();
        }

        // ========== DERS KAYITLARI SAYFASI (ödev listesi) ==========
        function renderDersKayitlari() {
            currentPage = "dersKayitlari";
            const students = loadStudentsData();
            if (students.length === 0) {
                document.getElementById("dynamic-content").innerHTML = `<div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-6 text-center text-gray-500">Henüz öğrenci eklenmemiş. Lütfen önce öğrenci ekleyin.</div>`;
                return;
            }
            let cardsHtml = '<div class="grid md:grid-cols-2 gap-5">';
            for (let s of students) {
                const aylikUcret = parseFloat(s.ucret) || 0;
                const { toplamDers, odenenDersSayisi, toplamOdeme } = getDersOzet(s.id, aylikUcret);
                cardsHtml += `
                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-md p-5 hover:shadow-lg transition cursor-pointer" onclick="renderDersDetay('${s.id}')">
                        <div class="flex justify-between"><h3 class="text-xl font-bold">${escapeHtml(s.adSoyad)}</h3><i class="fas fa-chevron-right text-gray-400"></i></div>
                        <p class="text-sm text-gray-500">${escapeHtml(s.okul)} | 📞 ${escapeHtml(s.veliTel || 'Belirtilmemiş')}</p>
                        <p class="text-sm text-blue-600">💰 Aylık Ücret: ${aylikUcret} TL</p>
                        <div class="mt-2 flex gap-3 text-sm"><span class="stat-badge">📚 Toplam Ders: ${toplamDers}</span><span class="stat-badge">✅ Ödenen Ders: ${odenenDersSayisi}</span><span class="stat-badge">💵 Toplam Ödeme: ${toplamOdeme} TL</span></div>
                    </div>
                `;
            }
            cardsHtml += '</div>';
            document.getElementById("dynamic-content").innerHTML = `<div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow mb-4"><h2 class="text-xl font-bold">📚 Ders Kayıtları</h2><p class="text-sm text-gray-500">Öğrenci kartına tıklayarak ders kayıtlarını yönetin.</p></div>${cardsHtml}`;
        }

        let _currentDersKayitStudentId = null;
        function renderDersDetay(studentId) {
            currentPage = "dersDetay";
            _currentDersKayitStudentId = studentId;
            const students = loadStudentsData();
            const student = students.find(s => s.id === studentId);
            if (!student) { renderDersKayitlari(); return; }
            let kayitlar = loadDersKayitlari(studentId);
            kayitlar = kayitlar.map((k, idx) => ({ ...k, dersNo: idx+1 }));
            saveDersKayitlari(studentId, kayitlar);
            let tableRows = '';
            for (let k of kayitlar) {
                const odevList = Array.isArray(k.odev) ? k.odev : (k.odev ? [k.odev] : []);
                const odevHtml = odevList.map(od => `<div class="inline-block bg-gray-200 dark:bg-gray-700 rounded-full px-2 py-0.5 text-xs mr-1 mb-1">${escapeHtml(od)}</div>`).join('');
                tableRows += `
                    <tr class="border-b">
                        <td class="p-2">${k.dersNo}</td>
                        <td class="p-2">${k.tarih}</td>
                        <td class="p-2">${k.konu}</td>
                        <td class="p-2">${escapeHtml(k.icerik || '')}</td>
                        <td class="p-2"><div class="flex flex-wrap">${odevHtml || '—'}</div></td>
                        <td class="p-2"><span class="px-2 py-1 rounded-full text-xs ${k.odendi ? 'bg-green-200 text-green-800' : 'bg-yellow-200 text-yellow-800'}">${k.odendi ? 'Ödendi' : 'Bekliyor'}</span></td>
                        <td class="p-2"><button onclick="editDersKayit('${studentId}', ${k.dersNo})" class="text-blue-500 mr-2"><i class="fas fa-edit"></i></button><button onclick="deleteDersKayit('${studentId}', ${k.dersNo})" class="text-red-500"><i class="fas fa-trash"></i></button></td>
                    </tr>
                `;
            }
            const html = `
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-5">
                    <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">📖 Ders Kayıtları - ${escapeHtml(student.adSoyad)}</h2><button onclick="renderDersKayitlari()" class="bg-gray-500 text-white px-4 py-2 rounded-xl"><i class="fas fa-arrow-left"></i> Geri</button></div>
                    <div class="mb-6 bg-gray-50 dark:bg-gray-900 p-4 rounded-xl"><h3 class="font-bold mb-2">➕ Yeni Ders Kaydı Ekle</h3><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><input type="date" id="kayitTarih" class="student-form-input"><select id="kayitKonu" class="modal-input"><option value="">Konu Seç</option>${getKonuListesiBySinif(student.sinif).map(k=>`<option value="${k}">${k}</option>`).join('')}</select><input type="text" id="kayitIcerik" placeholder="İçerik" class="student-form-input"></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-2"><div><label class="block text-sm">Ödevler</label><div class="flex gap-2"><input type="text" id="yeniOdev" placeholder="Ödev metni" class="student-form-input flex-1"><button onclick="addOdevToList()" class="bg-blue-500 text-white px-3 py-1 rounded">Ekle</button></div><div id="odevListesi" class="flex flex-wrap gap-1 mt-2"></div></div><div><label class="block text-sm">Ödeme Durumu</label><select id="kayitOdendi" class="modal-input"><option value="true">Ödendi</option><option value="false" selected>Bekliyor</option></select></div><div class="flex items-end"><button onclick="addDersKayit('${studentId}')" class="bg-green-600 text-white px-4 py-2 rounded-xl">Kaydet</button></div></div></div>
                    <div class="overflow-x-auto"><table class="w-full border-collapse border border-gray-300 dark:border-gray-700"><thead class="bg-gray-100 dark:bg-gray-700"><tr><th class="border p-2">Ders No</th><th class="border p-2">Tarih</th><th class="border p-2">Konu</th><th class="border p-2">İçerik</th><th class="border p-2">Ödevler</th><th class="border p-2">Durum</th><th class="border p-2">İşlemler</th></tr></thead><tbody>${tableRows || '<tr><td colspan="7" class="text-center p-4">Henüz ders kaydı yok.</td></tr>'}</tbody>}</div>
                </div>
            `;
            document.getElementById("dynamic-content").innerHTML = html;
            window._geciciOdevList = [];
            window.addOdevToList = () => {
                const input = document.getElementById("yeniOdev");
                const val = input.value.trim();
                if (val) {
                    window._geciciOdevList.push(val);
                    input.value = "";
                    const container = document.getElementById("odevListesi");
                    if (container) container.innerHTML = window._geciciOdevList.map((od, idx) => `<div class="bg-gray-200 dark:bg-gray-700 rounded-full px-2 py-1 text-xs flex items-center gap-1">${escapeHtml(od)}<button onclick="removeOdevFromList(${idx})" class="text-red-500"><i class="fas fa-times-circle"></i></button></div>`).join('');
                }
            };
            window.removeOdevFromList = (idx) => {
                window._geciciOdevList.splice(idx, 1);
                const container = document.getElementById("odevListesi");
                if (container) container.innerHTML = window._geciciOdevList.map((od, idx) => `<div class="bg-gray-200 dark:bg-gray-700 rounded-full px-2 py-1 text-xs flex items-center gap-1">${escapeHtml(od)}<button onclick="removeOdevFromList(${idx})" class="text-red-500"><i class="fas fa-times-circle"></i></button></div>`).join('');
            };
        }
        function addDersKayit(studentId) {
            const tarih = document.getElementById("kayitTarih").value;
            const konu = document.getElementById("kayitKonu").value;
            const icerik = document.getElementById("kayitIcerik").value;
            const odendi = document.getElementById("kayitOdendi").value === "true";
            const odevler = window._geciciOdevList || [];
            if (!tarih || !konu) { alert("Tarih ve konu seçiniz"); return; }
            let kayitlar = loadDersKayitlari(studentId);
            const yeniNo = kayitlar.length + 1;
            kayitlar.push({ dersNo: yeniNo, tarih, konu, icerik, odev: odevler, odendi });
            saveDersKayitlari(studentId, kayitlar);
            renderDersDetay(studentId);
        }
        function editDersKayit(studentId, dersNo) {
            let kayitlar = loadDersKayitlari(studentId);
            const idx = kayitlar.findIndex(k => k.dersNo === dersNo);
            if (idx === -1) return;
            const k = kayitlar[idx];
            const odevList = Array.isArray(k.odev) ? k.odev : (k.odev ? [k.odev] : []);
            const odevStr = odevList.join(", ");
            const yeniTarih = prompt("Tarih (YYYY-MM-DD):", k.tarih);
            const yeniKonu = prompt("Konu:", k.konu);
            const yeniIcerik = prompt("İçerik:", k.icerik);
            const yeniOdevlerStr = prompt("Ödevler (virgülle ayırın):", odevStr);
            const yeniOdendi = confirm("Ödendi mi? (Tamam:Ödendi, İptal:Bekliyor)");
            if (yeniTarih && yeniKonu) {
                const yeniOdevler = yeniOdevlerStr ? yeniOdevlerStr.split(",").map(s => s.trim()).filter(s => s) : [];
                kayitlar[idx] = { ...k, tarih: yeniTarih, konu: yeniKonu, icerik: yeniIcerik || '', odev: yeniOdevler, odendi: yeniOdendi };
                saveDersKayitlari(studentId, kayitlar);
                renderDersDetay(studentId);
            }
        }
        function deleteDersKayit(studentId, dersNo) {
            if (confirm("Bu ders kaydını silmek istediğinize emin misiniz?")) {
                let kayitlar = loadDersKayitlari(studentId);
                kayitlar = kayitlar.filter(k => k.dersNo !== dersNo);
                kayitlar = kayitlar.map((k, idx) => ({ ...k, dersNo: idx+1 }));
                saveDersKayitlari(studentId, kayitlar);
                renderDersDetay(studentId);
            }
        }

        // Karşılaştırma modalı (eksik fonksiyonlar, hata vermemesi için eklendi)
        function showCompareModal() { alert("Karşılaştırma özelliği yakında eklenecektir."); }
        function closeCompareModal() {}
        function renderComparison() {}

        window.selectStudent = async (id) => { await renderStudentPanel(id); };
        window.renderHomeScreen = renderHomeScreen; window.deleteStudent = deleteStudent;
        window.editStudent = editStudent; window.saveStudentEdit = saveStudentEdit;
        window.setSortOrder = setSortOrder; window.setFilter = setFilter;
        window.exportBackup = exportBackup; window.showImportModal = showImportModal;
        window.importBackup = importBackup; window.showCompareModal = showCompareModal; window.closeCompareModal = closeCompareModal;
        window.renderComparison = renderComparison; window.showDenemeAtaModal = showDenemeAtaModal;
        window.closeDenemeAtaModal = closeDenemeAtaModal; window.saveDenemeAta = saveDenemeAta;
        window.showAddStudentModal = showAddStudentModal; window.closeAddStudentModal = closeAddStudentModal;
        window.addStudentFromModal = addStudentFromModal; window.toggleTheme = toggleTheme;
        window.editExam = editExam; window.viewExam = viewExam; window.deleteExam = deleteExam;
        window.copyExamToOthers = copyExamToOthers; window.executeCopyExam = executeCopyExam;
        window.exportReport = exportReport; window.toggleReportMenu = toggleReportMenu; window.hideReportMenu = hideReportMenu;
        window.renderSchedulePage = renderSchedulePage;
        window.renderDersKayitlari = renderDersKayitlari;
        window.renderDersDetay = renderDersDetay;
        window.addDersKayit = addDersKayit;
        window.editDersKayit = editDersKayit;
        window.deleteDersKayit = deleteDersKayit;
        window.addOdevToList = window.addOdevToList;
        window.removeOdevFromList = window.removeOdevFromList;
        window.showAddScheduleModal = showAddScheduleModal;
        window.closeAddScheduleModal = closeAddScheduleModal;
        window.addScheduleFromModal = addScheduleFromModal;

        function registerPWA(){ 
            const manifest = { name:"Canfenci Deneme Analizi", short_name:"Canfenci", start_url:".", display:"standalone", theme_color:"#007BFF" }; 
            const link = document.createElement('link'); link.rel = 'manifest'; link.href = "data:application/json,"+encodeURIComponent(JSON.stringify(manifest)); 
            document.head.appendChild(link); 
            const swCode = `self.addEventListener('install',e=>self.skipWaiting()); self.addEventListener('fetch',e=>e.respondWith(fetch(e.request)));`; 
            if('serviceWorker' in navigator) navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'application/javascript'}))); 
        }
        window.onload = () => { applyTheme(); registerPWA(); renderHomeScreen(); };
    </script>
</body>
