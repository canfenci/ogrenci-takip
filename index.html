<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#151D31">
    <title>Canfenci Öğrenci Takip Sistemi</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Canfenci">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#394B87',
                        secondary: '#B58B4A'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --brand-500: #5167A9;
            --brand-600: #394B87;
            --brand-700: #2C3B70;
            --brand-soft: #EEF1F8;
            --accent: #B58B4A;
            --accent-soft: #F7F1E7;
            --surface-page: #F3F5F8;
            --surface-card: #FFFFFF;
            --surface-raised: #FBFCFE;
            --text-primary: #182033;
            --text-secondary: #667085;
            --border-subtle: #DDE2EA;
            --success: #059669;
            --warning: #D97706;
            --danger: #DC2626;
            --info: #2563EB;
        }
        .skip-link { position: fixed; left: 1rem; top: -4rem; z-index: 10000; background: #111827; color: white; padding: .75rem 1rem; border-radius: .5rem; }
        .skip-link:focus { top: 1rem; }
        :focus-visible { outline: 3px solid #F59E0B !important; outline-offset: 3px !important; }
        html { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important; letter-spacing: -0.006em; }
        h1, h2, h3, .app-page-title, .page-heading, .section-heading, .logo-canfenci { font-family: 'Manrope', 'Inter', sans-serif !important; }
        body:not(.dark) { background: radial-gradient(circle at 82% 0%, rgba(181,139,74,.07), transparent 26rem), var(--surface-page) !important; color: var(--text-primary) !important; }
        body:not(.dark) .bg-white, body:not(.dark) .bg-gray-50 { background-color: #FFFFFF !important; color: #111111 !important; }
        body:not(.dark) .text-gray-800 { color: #111111 !important; }
        body:not(.dark) button.bg-gray-200 { background-color: #E5E7EB !important; color: #111111 !important; }
        body:not(.dark) .stat-badge { background-color: #E9ECEF !important; color: #111111 !important; }
        body:not(.dark) #batchModal .sticky-footer { background-color: #F3F4F6 !important; color: #111111 !important; }
        body:not(.dark) .motivation-card { background-color: #EEF2FF !important; color: #3730A3 !important; border-color: #C7D2FE !important; }
        body:not(.dark) .weak-card { background-color: #FEE2E2 !important; border-color: #FECACA !important; }
        body:not(.dark) .weak-card h4, body:not(.dark) .weak-card p { color: #7F1D1D !important; }
        body:not(.dark) .strong-card { background-color: #D1FAE5 !important; border-color: #A7F3D0 !important; }
        body:not(.dark) .strong-card h4, body:not(.dark) .strong-card p { color: #064E3B !important; }
        body:not(.dark) .btn-batch { background-color: var(--brand-600) !important; color: white !important; }
        body:not(.dark) .btn-batch:hover { background-color: var(--brand-700) !important; }
        body:not(.dark) .exam-badge { background-color: #CBD5E1 !important; color: #0F172A !important; }
        body.dark input, body.dark input[type="number"] {
            background-color: #334155 !important;
            color: #F8F9FA !important;
            border-color: #475569 !important;
        }
        body.dark .konu-select, body.dark .durum-select, body.dark .hata-select {
            background-color: #334155 !important;
            color: #F8F9FA !important;
        }
        .logo-canfenci {
            font-weight: 800;
            font-size: inherit;
            display: inline-block;
        }
        .logo-canfenci .can-part { color: var(--brand-600); }
        .logo-canfenci .fenci-part { color: var(--accent); }
        body.dark .logo-canfenci .can-part { color: #818CF8; }
        body.dark .logo-canfenci .fenci-part { color: #A78BFA; }
        .logo-deneme { color: #111111; font-weight: 600; display: inline-block; }
        body.dark .logo-deneme { color: #FFFFFF; }
        
        /* Input modernization: border-2 & focus blue-500 ring */
        .student-form-input, .modal-input, select.modal-input {
            background-color: #FFFFFF !important;
            border: 2px solid #D1D5DB !important;
            padding: 0.6rem 0.8rem !important;
            border-radius: 0.75rem !important;
            width: 100% !important;
            color: #111111 !important;
            pointer-events: auto !important;
            transition: all 0.2s ease-in-out !important;
            outline: none !important;
        }
        .student-form-input:focus, .modal-input:focus, select.modal-input:focus {
            border-color: var(--brand-500) !important;
            box-shadow: 0 0 0 3px rgba(81, 103, 169, 0.14) !important;
        }
        body.dark .student-form-input, body.dark .modal-input, body.dark select.modal-input {
            background-color: #1f2937 !important;
            border-color: #4b5563 !important;
            color: #F8F9FA !important;
        }
        body.dark .student-form-input:focus, body.dark .modal-input:focus, body.dark select.modal-input:focus {
            border-color: #818CF8 !important;
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.3) !important;
        }
        
        body.dark { background-color: #111827 !important; color: #F8F9FA !important; }
        body.dark .bg-white, body.dark .bg-gray-50 { background-color: #1E293B !important; color: #F8F9FA !important; }
        body.dark .text-gray-800 { color: #E2E8F0 !important; }
        .btn-sort-active { background-color: var(--brand-600) !important; color: white !important; }
        .btn-sort-inactive { background-color: #E9ECEF !important; color: #212529 !important; border: 1px solid #CED4DA !important; }
        .stat-badge { padding: 0.25rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; }
        body.dark .btn-sort-inactive { background-color: #2C2C2C !important; color: #F8F9FA !important; }
        body.dark .motivation-card { background-color: #312E81 !important; color: #EEF2FF !important; }
        body.dark .weak-card { background-color: #7F1D1D !important; border-color: #991B1B !important; }
        body.dark .weak-card h4, body.dark .weak-card p { color: #FEE2E2 !important; }
        body.dark .strong-card { background-color: #064E3B !important; border-color: #047857 !important; }
        body.dark .strong-card h4, body.dark .strong-card p { color: #D1FAE5 !important; }
        
        /* Modern Card Layout Overwrite */
        .bg-white.rounded-2xl, .bg-gray-800.rounded-2xl {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05) !important;
            border: 1px solid rgba(229, 231, 235, 0.3) !important;
            padding: 1.25rem !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }
        body.dark .bg-white.rounded-2xl, body.dark .bg-gray-800.rounded-2xl {
            border-color: rgba(55, 65, 81, 0.4) !important;
        }
        .bg-white.rounded-2xl.cursor-pointer:hover, .bg-gray-800.rounded-2xl.cursor-pointer:hover {
            transform: translateY(-4px) !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
        }
        @media (min-width: 768px) {
            .bg-white.rounded-2xl, .bg-gray-800.rounded-2xl {
                padding: 1.5rem !important;
            }
        }
        
        /* Sayfa Başlıkları ve Bölüm Başlıkları Tasarımı */
        .page-heading {
            font-size: 1.625rem !important;
            font-weight: 800 !important;
            border-bottom: 2px solid rgba(79, 70, 229, 0.2) !important;
            padding-bottom: 0.5rem !important;
            margin-bottom: 1.25rem !important;
            display: flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
        }
        body.dark .page-heading {
            border-color: rgba(129, 140, 248, 0.3) !important;
        }
        /* Canfenci ortak uygulama yüzeyi */
        .app-page { max-width: 1180px; margin: 0 auto; display: grid; gap: 1rem; }
        .app-page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .app-page-title { font-size: 1.65rem; line-height: 1.2; font-weight: 850; letter-spacing: -0.025em; color: var(--text-primary); }
        .app-page-subtitle { margin-top: .35rem; color: var(--text-secondary); font-size: .9rem; }
        body.dark .app-page-title { color: #F8FAFC; }
        body.dark .app-page-subtitle { color: #94A3B8; }
        .app-panel { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: 1rem; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
        body.dark .app-panel { background: #1E293B; border-color: #334155; }
        .app-panel-header { padding: 1rem 1.1rem; border-bottom: 1px solid #E5E7EB; }
        body.dark .app-panel-header { border-color: #334155; }
        .app-metric { background: var(--surface-page); border: 1px solid var(--border-subtle); border-radius: .9rem; padding: .9rem 1rem; }
        body.dark .app-metric { background: #0F172A; border-color: #334155; }
        .app-metric-label { color: #64748B; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
        .app-metric-value { margin-top: .25rem; color: #0F172A; font-size: 1.15rem; font-weight: 850; }
        body.dark .app-metric-value { color: #F8FAFC; }
        .app-data-table { border-collapse: separate; border-spacing: 0; width: 100%; }
        .app-data-table th { padding: .75rem 1rem; background: #F8FAFC; color: #64748B; font-size: .72rem; text-align: left; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid #E5E7EB; }
        .app-data-table td { padding: .85rem 1rem; border-bottom: 1px solid #EEF2F7; vertical-align: middle; }
        .app-data-table tbody tr:last-child td { border-bottom: 0; }
        .app-data-table tbody tr:hover { background: #F8FAFC; }
        body.dark .app-data-table th { background: #0F172A; color: #94A3B8; border-color: #334155; }
        body.dark .app-data-table td { border-color: #334155; }
        body.dark .app-data-table tbody tr:hover { background: rgba(15,23,42,.65); }
        .app-disclosure > summary { list-style: none; cursor: pointer; }
        .app-disclosure > summary::-webkit-details-marker { display: none; }
        .app-disclosure[open] .disclosure-chevron { transform: rotate(180deg); }
        .disclosure-chevron { transition: transform .2s ease; }
        .btn-primary { background: var(--brand-600) !important; color: #FFFFFF !important; border: 1px solid var(--brand-600) !important; border-radius: .75rem; font-weight: 800; box-shadow: 0 1px 2px rgba(79,70,229,.18); }
        .btn-primary:hover { background: var(--brand-700) !important; border-color: var(--brand-700) !important; }
        .btn-secondary { background: #FFFFFF !important; color: var(--brand-600) !important; border: 1px solid #C7D2FE !important; border-radius: .75rem; font-weight: 750; }
        .btn-secondary:hover { background: var(--brand-soft) !important; }
        body.dark .btn-secondary { background: #1E293B !important; color: #A5B4FC !important; border-color: #4338CA !important; }
        .app-modal-backdrop { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(15,23,42,.58); backdrop-filter: blur(3px); }
        .app-modal { width: 100%; max-height: 90vh; overflow-y: auto; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: 1rem; box-shadow: 0 24px 60px rgba(15,23,42,.24); }
        .app-modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--border-subtle); }
        .app-modal-body { padding: 1.25rem; }
        .app-modal-close { min-width: 2.75rem; min-height: 2.75rem; border-radius: .75rem; color: var(--text-secondary); }
        .app-modal-close:hover { background: var(--brand-soft); color: var(--brand-700); }
        .app-segmented { display: flex; gap: .35rem; padding: .3rem; border-radius: .85rem; background: #F1F5F9; }
        .app-segmented button { flex: 1; min-height: 2.75rem; padding: .5rem .75rem; border-radius: .65rem; color: #64748B; font-weight: 750; }
        .app-segmented button.is-active { background: #FFFFFF; color: var(--brand-700); box-shadow: 0 1px 3px rgba(15,23,42,.12); }
        body.dark .app-modal { background: #1E293B; border-color: #334155; }
        body.dark .app-modal-header { border-color: #334155; }
        body.dark .app-segmented { background: #0F172A; }
        body.dark .app-segmented button.is-active { background: #334155; color: #C7D2FE; }
        .status-success { color: var(--success) !important; }
        .status-warning { color: var(--warning) !important; }
        .status-pill { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .3rem .65rem; font-size: .75rem; font-weight: 800; border: 1px solid transparent; }
        .status-pill-success { color: #047857; background: #ECFDF5; border-color: #A7F3D0; }
        .status-pill-warning { color: #B45309; background: #FFFBEB; border-color: #FDE68A; }
        .status-pill-danger { color: #B91C1C; background: #FEF2F2; border-color: #FECACA; }
        body.dark .status-pill-success { color: #6EE7B7; background: rgba(6,78,59,.35); border-color: #065F46; }
        body.dark .status-pill-warning { color: #FCD34D; background: rgba(120,53,15,.3); border-color: #92400E; }
        body.dark .status-pill-danger { color: #FCA5A5; background: rgba(127,29,29,.3); border-color: #991B1B; }
        .section-heading {
            font-size: 1.125rem !important;
            font-weight: 700 !important;
            border-bottom: 2px solid rgba(79, 70, 229, 0.1) !important;
            padding-bottom: 0.35rem !important;
            margin-bottom: 1rem !important;
            display: flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
        }
        body.dark .section-heading {
            border-color: rgba(129, 140, 248, 0.15) !important;
        }

        .sidebar-icon {
            width: 2rem;
            text-align: center;
        }
        /* Sidebar: Nature-inspired, minimalist, single color palette style */
        .sidebar-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem !important;
            width: 105%;
            padding: 0.75rem 1rem !important;
            border-radius: 0.75rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
            font-weight: 600;
            background: transparent !important;
            color: #374151 !important;
            border: none;
            cursor: pointer;
            min-height: 44px;
        }
        .sidebar-btn .sidebar-icon {
            color: #64748B !important;
            transition: color 0.25s;
        }
        .sidebar-btn:hover {
            background-color: #EEF2FF !important;
            color: var(--brand-700) !important;
            transform: translateX(4px) !important;
        }
        .sidebar-btn:hover .sidebar-icon {
            color: var(--brand-700) !important;
        }
        .sidebar-btn.active {
            background: var(--brand-600) !important;
            color: #FFFFFF !important;
            box-shadow: 0 4px 10px -2px rgba(79, 70, 229, 0.3) !important;
        }
        .sidebar-btn.active .sidebar-icon {
            color: #FFFFFF !important;
        }
        
        body.dark .sidebar-btn {
            background: transparent !important;
            color: #9CA3AF !important;
        }
        body.dark .sidebar-btn .sidebar-icon {
            color: #94A3B8 !important;
        }
        body.dark .sidebar-btn:hover {
            background-color: #1E1B4B !important;
            color: #FFFFFF !important;
        }
        body.dark .sidebar-btn:hover .sidebar-icon {
            color: #FFFFFF !important;
        }
        body.dark .sidebar-btn.active {
            background: #4338CA !important;
            color: #FFFFFF !important;
            box-shadow: 0 4px 10px -2px rgba(79, 70, 229, 0.4) !important;
        }
        body.dark .sidebar-btn.active .sidebar-icon {
            color: #FFFFFF !important;
        }

        .tab-active {
            border-bottom: 2px solid var(--brand-600);
            color: var(--brand-600);
        }
        .tab-inactive {
            border-bottom: 2px solid transparent;
            color: #6C757D;
        }
        body.dark .tab-inactive {
            color: #9CA3AF;
        }
        .filter-btn-active {
            background-color: var(--brand-600) !important;
            color: white !important;
        }
        .filter-btn-inactive {
            background-color: #E5E7EB !important;
            color: #1F2937 !important;
        }
        body.dark .filter-btn-inactive {
            background-color: #374151 !important;
            color: #E5E7EB !important;
        }
        .btn-all-correct {
            background-color: #10B981 !important;
            color: white !important;
            transition: all 0.2s;
        }
        .btn-all-correct:hover {
            background-color: #059669 !important;
            transform: translateY(-1px);
        }
        /* Mobile bottom nav active styling */
        .mobile-nav-btn {
            color: #6B7280;
            transition: color 0.2s;
        }
        .mobile-nav-btn.active {
            color: var(--brand-600) !important;
        }
        body.dark .mobile-nav-btn.active {
            color: #818CF8 !important;
        }
        body.dark .mobile-nav-btn {
            color: #9CA3AF;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        @media (max-width: 767px) {
            #dynamic-content {
                padding-bottom: 120px !important;
            }
        }
        
        /* PWA Tıklama Alanı Düzenlemeleri */
        button, a, select, [onclick], .cursor-pointer {
            min-height: 44px;
        }
        
        button[class*="bg-"] {
            padding-top: 0.625rem !important;
            padding-bottom: 0.625rem !important;
        }
        
        .mobile-nav-btn {
            height: 100% !important;
            min-height: 48px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            flex: 1 !important;
            padding: 4px 0 0 0 !important;
            position: relative;
            background: transparent !important;
            border: none !important;
            outline: none !important;
        }
        
        /* Özel Tablo Düzenlemeleri (Ders Programı & Ders Kayıtları) */
        .weekly-schedule-table td, 
        .weekly-schedule-table th, 
        .ders-kayitlari-table td, 
        .ders-kayitlari-table th {
            font-size: 1rem !important;
            height: 60px !important;
            vertical-align: middle !important;
        }
        
        /* Eski tablolar için başlık; yeni uygulama tabloları kendi sade stilini kullanır. */
        table:not(.app-data-table) thead {
            background-color: #1f2937 !important;
            color: #ffffff !important;
        }
        body.dark table:not(.app-data-table) thead {
            background-color: #111827 !important;
        }
        table:not(.app-data-table) thead th {
            color: #ffffff !important;
            font-size: 1rem !important;
        }
        
        /* Mobile Nav Glassmorphism & Safe Area */
        .mobile-nav-bar {
            height: calc(68px + env(safe-area-inset-bottom, 0px)) !important;
            padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;
            background-color: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border-top: 1px solid rgba(229, 231, 235, 0.5) !important;
        }
        body.dark .mobile-nav-bar {
            background-color: rgba(30, 41, 59, 0.85) !important;
            border-top: 1px solid rgba(55, 65, 81, 0.5) !important;
        }
        .mobile-nav-btn.active i {
            transform: scale(1.1) translateY(-2px);
            color: var(--brand-600) !important;
        }
        body.dark .mobile-nav-btn.active i {
            color: #818CF8 !important;
        }
        .mobile-nav-btn::after {
            content: '';
            position: absolute;
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: var(--accent);
            transition: transform 0.2s ease-in-out;
        }
        body.dark .mobile-nav-btn::after {
            background-color: rgba(255,255,255,.96);
            border-top: 1px solid var(--border-subtle);
            backdrop-filter: blur(14px);
        }
        body.dark .mobile-nav-bar { background-color: rgba(15,23,42,.96); border-color: #334155; }
        .mobile-nav-btn.active::after {
            transform: translateX(-50%) scale(1);
        }
        
        /* Dynamic Bottom Offsets for Mobile Banners */
        @media (max-width: 767px) {
            #pwaInstallBanner {
                bottom: calc(80px + env(safe-area-inset-bottom, 16px)) !important;
                left: 1rem !important;
                right: 1rem !important;
            }
            #pwaUpdateBanner {
                bottom: calc(80px + env(safe-area-inset-bottom, 16px)) !important;
                left: 1rem !important;
                right: 1rem !important;
            }
            #syncStatus {

</head>
<body class="bg-gray-100 font-sans antialiased">
    <a class="skip-link" href="#dynamic-content">Ana içeriğe geç</a>
    <div id="app-root" class="flex flex-col md:flex-row min-h-[100dvh]">
        <div class="app-sidebar hidden md:flex w-full md:w-1/4 bg-white dark:bg-gray-800 shadow-lg p-5 flex-col gap-6">
            <div class="flex items-center gap-2 border-b pb-4 mb-2">
                <img src="icons/icon-192x192.png" alt="Canfenci Logo" class="w-11 h-11 rounded-xl shadow-sm" onerror="this.style.display='none'">
                <div class="text-xl font-extrabold">
                    <span class="logo-canfenci">
                        <span class="can-part">Can</span><span class="fenci-part">fenci</span>
                    </span>
                    <span class="logo-deneme block text-sm">Öğrenci Takip Sistemi</span>
                </div>
            </div>
            <div class="flex flex-col gap-2">
                <button id="sidebar-nav-reminders" onclick="renderReminderHome()" class="sidebar-btn gap-3 py-3 text-sm"><i class="fas fa-home sidebar-icon text-xl"></i> Ana Sayfa</button>
                <button id="sidebar-nav-home" onclick="renderHomeScreen()" class="sidebar-btn gap-3 py-3 text-sm"><i class="fas fa-users sidebar-icon text-xl"></i> Öğrenciler</button>
                <button id="sidebar-nav-guidance" onclick="renderGuidancePage()" class="sidebar-btn gap-3 py-3 text-sm"><i class="fas fa-compass sidebar-icon text-xl"></i> Rehberlik</button>
                <button id="sidebar-nav-groups" onclick="renderGroupsPage()" class="sidebar-btn gap-3 py-3 text-sm"><i class="fas fa-users-cog sidebar-icon text-xl"></i> Sınıf & Gruplar</button>
                <button id="sidebar-nav-schedule" onclick="renderSchedulePage()" class="sidebar-btn gap-3 py-3 text-sm"><i class="fas fa-calendar-alt sidebar-icon text-xl"></i> Ders Programı</button>
                <button id="sidebar-nav-homework" onclick="renderOdevTakibi()" class="sidebar-btn gap-3 py-3 text-sm"><i class="fas fa-tasks sidebar-icon text-xl"></i> Ödev Takibi</button>
                <button id="sidebar-nav-lessons" onclick="renderDersKayitlari()" class="sidebar-btn gap-3 py-3 text-sm"><i class="fas fa-book-open sidebar-icon text-xl"></i> Ders Kayıtları</button>
                <button onclick="showDenemeAtaModal()" class="sidebar-btn gap-3 py-3 text-sm"><i class="fas fa-copy sidebar-icon text-xl"></i> Deneme Ata</button>
                <button onclick="toggleTheme()" class="sidebar-btn gap-3 py-3 text-sm"><i class="fas fa-moon sidebar-icon text-xl"></i> <span id="themeBtnText">Koyu Mod</span></button>
                <button id="sidebar-nav-general" onclick="renderGenelIslemler()" class="sidebar-btn gap-3 py-3 text-sm"><i class="fas fa-cog sidebar-icon text-xl"></i> Ayarlar</button>
            </div>
            <div class="text-xs text-gray-400 dark:text-gray-555 mt-auto pt-4 text-center">
                <i class="fas fa-flask"></i> PWA Standartlarında
            </div>
        </div>

        <!-- Mobile Bottom Navigation Bar -->
        <div class="flex md:hidden items-center justify-around fixed bottom-0 left-0 right-0 z-40 shadow-lg pb-safe mobile-nav-bar">
            <button onclick="renderReminderHome()" class="flex flex-col items-center gap-0.5 text-xs font-semibold mobile-nav-btn text-blue-600 dark:text-blue-400 active" id="mobile-nav-reminders">
                <i class="fas fa-home text-xl"></i>
                <span>Ana</span>
            </button>
            <button onclick="renderHomeScreen()" class="flex flex-col items-center gap-0.5 text-sm font-semibold mobile-nav-btn text-gray-500" id="mobile-nav-home">
                <i class="fas fa-users text-xl"></i>
                <span>Öğrenciler</span>
            </button>
            <button onclick="renderSchedulePage()" class="flex flex-col items-center gap-0.5 text-sm font-semibold mobile-nav-btn text-gray-500" id="mobile-nav-schedule">
                <i class="fas fa-calendar-alt text-xl"></i>
                <span>Program</span>
            </button>
            <button onclick="renderOdevTakibi()" class="flex flex-col items-center gap-0.5 text-sm font-semibold mobile-nav-btn text-gray-500" id="mobile-nav-homework">
                <i class="fas fa-tasks text-xl"></i>
                <span>Ödevler</span>
            </button>
            <button onclick="renderDersKayitlari()" class="flex flex-col items-center gap-0.5 text-sm font-semibold mobile-nav-btn text-gray-500" id="mobile-nav-lessons">
                <i class="fas fa-book-open text-xl"></i>
                <span>Kayıtlar</span>
            </button>
            <button onclick="renderGenelIslemler()" class="flex flex-col items-center gap-0.5 text-xs font-semibold mobile-nav-btn text-gray-500" id="mobile-nav-general">
                <i class="fas fa-cog text-xl"></i>
                <span>Ayarlar</span>
            </button>
        </div>

        <div class="app-workspace w-full md:w-3/4 px-5 py-6 md:p-8 pb-36 md:pb-8 overflow-y-auto">
            <div id="offlineIndicator" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 bg-red-600 text-white px-4 py-2 rounded-full text-sm shadow-xl font-semibold hidden flex items-center gap-2">
                <i class="fas fa-wifi-slash"></i> Çevrimdışı Çalışılıyor (Verileriniz yerel kaydediliyor)
            </div>
            <div id="pwaUpdateBanner" class="fixed bottom-16 right-4 z-50 bg-blue-600 text-white px-4 py-3 rounded-xl text-sm shadow-2xl font-semibold hidden flex items-center gap-3">
                <span>✨ Yeni bir sürüm mevcut!</span>
                <button onclick="window.location.reload(true)" class="bg-white text-blue-600 px-3 py-1 rounded-lg text-xs font-bold hover:bg-gray-100 transition-colors">Yenile</button>
            </div>
            <div id="pwaInstallBanner" class="fixed bottom-20 left-4 right-4 md:left-auto md:right-4 md:w-80 z-50 bg-gradient-to-r from-primary to-secondary text-white p-4 rounded-2xl shadow-2xl hidden flex flex-col gap-2">
                <div class="flex items-start justify-between">
                    <div class="flex items-center gap-2">
                        <img src="icons/icon-192x192.png" class="w-10 h-10 rounded-xl bg-white p-1" alt="Canfenci">
                        <div>
                            <h4 class="font-bold text-sm">Canfenci Takip Sistemi</h4>
                            <p class="text-xs opacity-90">Uygulamayı ana ekrana ekleyin</p>
                        </div>
                    </div>
                    <button onclick="dismissPWAInstall()" class="text-white/80 hover:text-white"><i class="fas fa-times"></i></button>
                </div>
                <div class="flex gap-2 justify-end mt-1">
                    <button onclick="dismissPWAInstall()" class="px-3 py-1.5 text-xs font-medium text-white/90 hover:text-white">Daha Sonra</button>
                    <button onclick="triggerPWAInstall()" class="px-4 py-1.5 bg-white text-primary rounded-lg text-xs font-bold hover:bg-gray-100 transition-colors">Yükle</button>
                </div>
            </div>
            <div id="syncStatus" class="fixed bottom-4 right-4 z-50 bg-gray-800 text-white px-3 py-1 rounded-full text-xs shadow-lg hidden"></div>
            <main id="dynamic-content" tabindex="-1" aria-live="polite"></main>
        </div>
    </div>

    <!-- ES Module script block loading all dependencies -->
    <script type="module">
        import './firebase-config.js';
        import './store.js';
        import './ui-helpers.js';
        import './auth.js';
        import './teacher-profile.js';
        import './students.js';
        import './guidance.js';
        import './exams.js';
        import './homework.js?v=62';
        import './schedule.js';
        import './lesson-reminders.js';
        import './data-validation.js';
        import './finance.js';
        import './growth.js';
        import './groups.js';

        window.onload = () => {
            if (window.applyTheme) window.applyTheme();
            if (window.registerPWA) window.registerPWA();
            if (window.CLOUD_FEATURES_ENABLED !== true && window.showLocalDevelopmentBanner) {
                window.showLocalDevelopmentBanner();
            }
            if (window.initializeLessonReminders) window.initializeLessonReminders();
            
            const urlParams = new URLSearchParams(window.location.search);
            const action = urlParams.get('action');
            
            if (action === 'parent-hw-entry') {
                if (window.hideNavigationElements) window.hideNavigationElements();
                document.getElementById("dynamic-content").innerHTML = `
                    <div class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 border mt-10 text-center">
                        <div class="text-amber-500 text-5xl mb-4"><i class="fas fa-shield-alt"></i></div>
                        <h2 class="text-xl font-bold mb-2">Bağlantı Devre Dışı</h2>
                        <p class="text-gray-500 text-sm">Güvenliğiniz için herkese açık ödev sonuç bağlantıları kapatıldı. Sonucunuzu öğretmeninize doğrudan iletin.</p>
                    </div>`;
            } else if (action === 'teacher-import-hw') {
                const studentId = urlParams.get('studentId');
                const hwId = urlParams.get('hwId');
                const dogru = parseInt(urlParams.get('d')) || 0;
                const yanlis = parseInt(urlParams.get('y')) || 0;
                if (window.importHwResult) window.importHwResult(studentId, hwId, dogru, yanlis);
            } else {
                if (window.isFirebaseActive && window.auth) {
                    window.auth.onAuthStateChanged(user => {
                        if (user) {
                            if (window.initializeFirestoreSync) {
                                window.initializeFirestoreSync().then(() => {
                                    if (window.ensureTeacherProfile && !window.ensureTeacherProfile()) return;
                                    const page = urlParams.get('page');
                                    if (page === 'odevler' && window.renderOdevTakibi) {
                                        window.renderOdevTakibi();
                                    } else if (window.renderReminderHome) {
                                        window.renderReminderHome();
                                    }
                                });
                            }
                        } else {
                            if (window.renderLoginScreen) window.renderLoginScreen();
                        }
                    });
                } else {
                    if (window.ensureTeacherProfile && !window.ensureTeacherProfile()) return;
                    const page = urlParams.get('page');
                    if (page === 'odevler' && window.renderOdevTakibi) {
                        window.renderOdevTakibi();
                    } else if (window.renderReminderHome) {
                        window.renderReminderHome();
                    }
                }
            }
        };
    </script>
</body>
</html>
